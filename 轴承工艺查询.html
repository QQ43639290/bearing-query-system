      // 响应式选项布局模块
      const StrictlyResponsiveRadioGroup = {
        // 初始化所有选项组的响应式布局
        init: function () {
          const radioGroups = document.querySelectorAll('.radio-group');
          radioGroups.forEach(group => {
            this.applyStrictLayout(group);
          });
        },

        // 应用响应式布局到选项组
        applyStrictLayout: function (group) {
          // 获取容器宽度，宽度不足时直接返回
          const containerWidth = group.offsetWidth;
          if (!containerWidth || containerWidth < 100) return;

          // 获取所有选项，无选项时直接返回
          const items = group.querySelectorAll('.radio-item');
          if (items.length === 0) return;

          // 设置基本参数
          const isMobile = window.innerWidth <= 768;
          const minItemWidth = isMobile ? 45 : 100; // 移动端和桌面端的最小宽度
          const gap = 8; // 选项间距

          // 清除所有选项的现有样式
          items.forEach(item => {
            item.style.flex = '';
            item.style.minWidth = '';
            item.style.maxWidth = '';
          });

          // 逐行处理选项
          for (let i = 0; i < items.length;) {
            // 计算当前行最多可放置的选项数量
            const maxPossibleItems = Math.floor((containerWidth + gap) / (minItemWidth + gap));
            // 确定当前行实际放置的选项数量
            const itemsInRow = Math.min(maxPossibleItems, items.length - i);

            // 计算每个选项的宽度
            const totalGapWidth = (itemsInRow - 1) * gap;
            const availableWidth = containerWidth - totalGapWidth;
            const itemWidth = Math.floor(availableWidth / itemsInRow);

            // 应用样式到当前行的选项
            for (let j = 0; j < itemsInRow && i + j < items.length; j++) {
              const item = items[i + j];

              if (isMobile) {
                // 移动端：使用固定宽度
                item.style.flex = '0 0 auto';
                item.style.width = `${minItemWidth}px`;
              } else {
                // 桌面端：等比例拉伸
                item.style.flex = `1 1 ${itemWidth}px`;
              }
              item.style.minWidth = `${minItemWidth}px`;
            }

            // 移动到下一行
            i += itemsInRow;
          }
        }
      };

      /**
       * 页面加载完成后的初始化设置
       * 这个函数在HTML页面完全加载后执行，负责设置各种默认值和事件监听器
       * 
       * 主要功能：
       * 1. 设置挡边系数和钢球系数的默认值
       * 2. 添加窗口大小变化监听，实现响应式布局
       * 3. 为型号输入框添加键盘事件监听（回车查询和自动查询）
       * 4. 为所有单选按钮添加切换监听，实现参数切换时的自动查询
       */
      document.addEventListener('DOMContentLoaded', function () {

        const iElement = document.getElementById('i');

        if (kdInnerElement) kdInnerElement.value = '0.38'; // 内圈挡边系数默认值

        // 设置新增输入框的默认值

        if (alphaElement) alphaElement.value = '0';   // 角接触角默认值

        /**
         * 窗口大小变化监听器
         * 当用户调整浏览器窗口大小时，重新渲染工艺参数查询结果
         * 这样可以确保在不同屏幕尺寸下都能正确显示表格布局
         */

            renderProcessResults();
          }
        });

        /**
         * 型号输入框的事件监听器设置
         * 为用户提供便捷的查询方式：回车键查询和输入时自动查询
         */
        const modelInput = document.getElementById('model');
        let modelSearchTimeout; // 用于控制自动查询的定时器

        // 回车键查询：用户输入型号后按回车键直接查询
        modelInput.addEventListener('keypress', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            queryBearing();
          }
        });

        // 自动查询：用户输入时延迟500毫秒后自动查询
        modelInput.addEventListener('input', function () {
          // 清除之前的定时器
          clearTimeout(modelSearchTimeout);

          // 设置新的定时器，延迟500ms执行查询

            if (modelInput.value.trim()) {

            }

         * 尺寸输入框的事件监听器设置
         * 为内径(d)、外径(D)、宽度(B)三个尺寸输入框提供便捷查询方式
         */
        const dimensionInputs = [
          document.getElementById('dimension-d'),
          document.getElementById('dimension-D'),
          document.getElementById('dimension-B')

        let dimensionSearchTimeout; // 用于控制尺寸自动查询的定时器

           * 回车键查询：用户输入尺寸后按回车键直接查询
           * 方便用户快速确认查询结果

           * 延迟查询避免用户还在输入时就频繁查询
           */
          input.addEventListener('input', function () {
            // 清除之前的定时器，避免重复查询
            clearTimeout(dimensionSearchTimeout);

            // 设置新的定时器，延迟500ms执行查询
            dimensionSearchTimeout = setTimeout(function () {
              // 检查是否有至少一个尺寸输入了值
              const hasValue = dimensionInputs.some(inp => inp.value.trim());
              if (hasValue) {

         * 单选按钮标签的点击事件处理
         * 为所有单选按钮标签（如公差等级、游隙组别、振动等级等）添加点击事件
         * 实现点击切换选中状态，并支持取消选中功能
         */
        const radioLabels = document.querySelectorAll('.radio-item label');

        radioLabels.forEach(label => {
          /**
           * 标签点击事件处理函数
           * 实现单选按钮的智能切换：点击已选中的按钮可以取消选中
           * 这样可以方便用户清除当前选择，查看默认参数状态
           */
          label.addEventListener('click', function (e) {
            const radio = this.previousElementSibling;

            // 如果点击的是已选中的按钮，则取消选中
            if (radio.checked) {
              radio.checked = false;
              e.preventDefault(); // 阻止默认行为，避免浏览器重新选中
            }
            // 否则，让浏览器默认行为处理（选中）

             * 延迟执行自动查询
             * 等待10毫秒确保单选按钮状态已更新到DOM
             * 然后重新查询当前型号，显示新参数下的轴承数据

            setTimeout(autoQuery, 10);

        // 2. 如果输入包含69，就生成619的版本
        if (input.includes('69')) {

        }





        // 返回所有候选型号
        return Array.from(candidates);
      }

      // 复制内容到剪贴板
      function copyToClipboard(fullContent = true, rowElement = null) {
        // 获取结果表格
        const table = document.querySelector('#result .result-table');
        if (!table) {
          alert("没有可复制的内容！");
          return;
        }

        // 辅助函数：提取行文本内容
        const extractRowContent = (row) => {
          const label = row.querySelector('.param-label').textContent.replace('：', '');
          const value = row.querySelector('.param-value').textContent;
          return `${label}: ${value}`;
        };

        // 根据模式构建文本内容
        const textContent = fullContent
          ? buildFullContent()
          : extractRowContent(rowElement);

        // 使用Clipboard API复制文本
        navigator.clipboard.writeText(textContent)
          .then(() => showCopyFeedback(fullContent, rowElement))
          .catch(err => {
            console.error('复制失败:', err);
            alert('复制失败，请手动选择文本复制');
          });

        // 构建全部内容的函数
        function buildFullContent() {
          let content = "深沟球轴承基本尺寸查询结果\n" + "=".repeat(30) + "\n\n";

          // 添加主要参数
          table.querySelectorAll('tr').forEach(row => {
            content += extractRowContent(row) + '\n';
          });

          // 添加更多参数（如果显示）
          const moreParamsResults = document.getElementById('moreParamsResults');
          if (moreParamsResults && moreParamsResults.style.display !== 'none') {
            const moreParamsTable = moreParamsResults.querySelector('.result-table');
            if (moreParamsTable) {
              content += "\n更多参数计算结果\n" + "-".repeat(30) + "\n\n";
              // 从第二行开始（跳过标题行）
              Array.from(moreParamsTable.querySelectorAll('tr')).slice(1).forEach(row => {
                content += extractRowContent(row) + '\n';
              });
            }
          }

          return content + `\n查询时间: ${new Date().toLocaleString()}`;
        }

        // 显示复制成功反馈的函数
        function showCopyFeedback(isFullContent, element) {
          if (isFullContent) {
            const copyBtn = document.querySelector('.copy-btn');
            const originalText = copyBtn.innerHTML;

            copyBtn.innerHTML = '<span class="icon">✓</span> 已复制到剪贴板';
            copyBtn.classList.add('copy-success');

            setTimeout(() => {
              copyBtn.innerHTML = originalText;
              copyBtn.classList.remove('copy-success');
            }, 2000);
          } else {
            // 单行复制成功反馈
            element.classList.add('row-copied');
            setTimeout(() => element.classList.remove('row-copied'), 1000);
          }
        }
      }

      // ========== 尺寸查询功能 ==========

      // 验证尺寸输入
      function validateDimensionInputs(d, D, B) {
        if (Object.keys(bearingData).length === 0) {
          alert('轴承数据尚未加载，请等待...');
          return false;
        }

        if (isNaN(d) && isNaN(D) && isNaN(B)) {
          alert("请至少输入一个尺寸！");
          return false;
        }

        if (!isNaN(d) && !isNaN(D) && d >= D) {
          alert("内径必须小于外径！");
          return false;
        }

        return true;
      }

      // 按外形尺寸查询轴承型号
      function queryByDimensions() {
        const d = parseFloat(document.getElementById('dimension-d').value);
        const D = parseFloat(document.getElementById('dimension-D').value);
        const B = parseFloat(document.getElementById('dimension-B').value);

        if (!validateDimensionInputs(d, D, B)) return;

        displayDimensionResults(findBearingsByDimensions(d, D, B), d, D, B);
      }

      // 根据外形尺寸查找轴承型号
      function findBearingsByDimensions(d, D, B) {
        // 特殊处理：如果输入69，直接匹配619系列
        let targetModels = null;
        if (d === 69) {
          targetModels = ['619'];
        } else if (d === 68) {
          targetModels = ['618'];
        } else if (d === 160) {
          targetModels = ['160'];
        } else if (d === 600) {
          targetModels = ['60'];
        }

        return Object.entries(bearingData)
          .filter(([model, bearing]) => {
            const { d: bd, D: bD, B: bB } = bearing;

            // 如果指定了目标系列，只检查型号前缀，跳过尺寸匹配
            if (targetModels) {
              return targetModels.some(prefix => model.startsWith(prefix));
            }

            // 普通输入才做尺寸匹配
            return bd && bD && bB && calculateDimensionMatch(d, D, B, bd, bD, bB) > 0;
          })
          .map(([model, bearing]) => {
            // 系列输入直接给满分，普通输入计算匹配度
            const matchScore = targetModels ? 100 : calculateDimensionMatch(d, D, B, bearing.d, bearing.D, bearing.B);
            return {
              model,
              bearing,
              matchScore,
              matchLevel: getMatchLevel(matchScore)
            };
          })
          .sort((a, b) => b.matchScore - a.matchScore)
          .slice(0, 15);
      }

      // 计算尺寸匹配度
      function calculateDimensionMatch(d, D, B, bd, bD, bB) {
        const dimensions = [
          { input: d, actual: bd, tolerance: 0.15, name: '内径' },
          { input: D, actual: bD, tolerance: 0.15, name: '外径' },
          { input: B, actual: bB, tolerance: 0.15, name: '宽度' }
        ];

        let validCount = 0;
        let totalDiff = 0;
        let debugInfo = [];

        for (const dim of dimensions) {
          if (isNaN(dim.input)) continue;

          const diff = Math.abs(dim.input - dim.actual) / dim.input;
          debugInfo.push(`${dim.name}: ${dim.input} vs ${dim.actual}, diff: ${(diff * 100).toFixed(1)}%`);

          if (diff > dim.tolerance) {
            console.log(`匹配失败: ${dim.name}差异${(diff * 100).toFixed(1)}% > 容差${(dim.tolerance * 100).toFixed(1)}%`);
            return 0;
          }

          totalDiff += diff;
          validCount++;
        }

        const score = validCount === 0 ? 0 : Math.max(0, 100 - (totalDiff / validCount * 100));
        console.log(`匹配度计算: ${debugInfo.join(' | ')}, 最终得分: ${score.toFixed(1)}`);

        return score;
      }

      // 根据匹配度分数获取匹配等级
      function getMatchLevel(score) {
        if (score >= 99) return 'perfect';
        if (score >= 90) return 'good';
        return 'fair';
      }

      // 显示尺寸查询结果
      function displayDimensionResults(matches, d, D, B) {

            return isNaN(value) ? null : `${label}: ${value}mm`;
          })
          .filter(Boolean)
          .join(' × ');

        if (matches.length === 0) {
          resultDiv.innerHTML = `<p style="color: #e74c3c;">未找到与尺寸 ${dimensionText} 匹配的轴承型号！</p>`;
          resultDiv.style.display = 'block';
          return;
        }

        const matchConfig = {
          perfect: { text: '精确匹配', class: 'match-perfect' },
          good: { text: '高度匹配', class: 'match-good' },
          fair: { text: '近似匹配', class: 'match-fair' }
        };

        const resultItems = matches.map(({ model, bearing, matchLevel }) => {
          const { d: bd, D: bD, B: bB } = bearing;
          const config = matchConfig[matchLevel];
          return `
            <div class="dimension-result-item" onclick="selectDimensionResult('${model}')">

                <span class="dimension-match-level ${config.class}">${config.text}</span>
              </div>
            </div>
          `;
        }).join('');

        resultDiv.innerHTML = `
          <h3 style="color: var(--primary-blue); margin-bottom: 15px; text-align: center;">尺寸查询结果 (${dimensionText})</h3>
          <p>找到 ${matches.length} 个匹配的轴承型号：</p>

            点击型号可查看详细参数

        resultDiv.style.display = "block";

      // ============================================================ 
      // 主查询函数 - 根据型号查询轴承参数
      // 用途：整个应用的核心功能函数，处理轴承型号查询逻辑
      // 功能流程：
      // 查询流程：验证输入、收集参数、匹配型号、显示结果/推荐
      /**
             * 轴承型号主查询函数
             * 用途：整个应用的核心功能函数，处理轴承型号查询逻辑，是用户与系统交互的主要接口
             * 参数：无（直接从DOM获取用户输入）
             * 返回值：无（直接更新页面显示）
             * 功能流程：
             * 1. 获取并验证用户输入的轴承型号
             * 2. 收集用户选择的辅助参数（游隙、振动等级、公差等）
             * 3. 生成候选型号并尝试精确匹配
             * 4. 如找到匹配，渲染并显示详细结果
             * 5. 如未找到，使用多维度相似度算法推荐相似型号
             * 注意事项：
             * - 支持多种型号格式变体
             * - 包含输入验证和错误处理
             * - 更新全局变量currentModel记录当前查询状态
             */
      function queryBearing() {
        // 检查数据是否已加载
        if (Object.keys(bearingData).length === 0) {
          alert('轴承数据尚未加载，请等待...');
          return;
        }

        // 步骤1: 获取用户输入的轴承型号并去除前后空格
        const modelInput = document.getElementById("model").value.trim();

        // 更新全局变量currentModel记录当前查询的型号
        if (modelInput) {
          currentModel = modelInput;
        }

        // 输入验证：确保用户输入了型号
        if (!modelInput) {
          alert("请输入轴承型号！");
          // 隐藏结果容器
          const resultDiv = document.getElementById("result");
          resultDiv.style.display = "none";
          return;
        }

        // 步骤2: 获取用户选择的各项辅助参数
        // 游隙选择（Clearance）- 轴承内部间隙的大小
        const clearance = document.querySelector('input[name="clearance"]:checked')?.value || '';

        // 振动加速度等级选择 - 衡量轴承运行时振动加速度的级别
        const vibAcc = document.querySelector('input[name="vibAcc"]:checked')?.value || '';

        // 振动速度等级选择 - 衡量轴承运行时振动速度的级别
        const vibVel = document.querySelector('input[name="vibVel"]:checked')?.value || '';

        // 公差等级选择 - 轴承尺寸和形状的精度等级
        const tolerance = document.querySelector('input[name="tolerance"]:checked')?.value || '';

        // 步骤3: 生成候选型号并尝试精确匹配
        // 通过generateCandidateModels函数生成可能的候选型号变体
        // （处理不同格式、省略符号等情况）
        const candidates = generateCandidateModels(modelInput);
        let foundModel = null; // 存储找到的精确匹配型号
        let bearing = null;    // 存储找到的轴承数据

        // 遍历候选型号列表，查找精确匹配
        for (const cand of candidates) {
          if (bearingData[cand]) { // 检查候选型号是否存在于轴承数据库中
            foundModel = cand;     // 记录找到的型号
            bearing = bearingData[cand]; // 记录对应的轴承数据
            break;                 // 找到匹配后退出循环
          }
        }

        const resultDiv = document.getElementById("result");

        // 步骤4: 如果找到匹配的轴承型号
        if (bearing) {
          // 更新currentModel为实际找到的型号（可能与用户输入略有不同）
          currentModel = foundModel;

          // 渲染查询结果，传入找到的型号、轴承数据和所有用户选择的参数
          renderResult(foundModel, bearing, tolerance, clearance, vibAcc, vibVel);
          return; // 完成查询，结束函数执行
        }

        // 步骤5: 未找到精确匹配的型号，执行改进版相似型号推荐算法
        // 多维度轴承型号相似度评分算法
        // 算法原理：
        // - 通过5个不同维度的相似度计算，对轴承型号进行综合评分
        // - 每个维度赋予不同权重，确保重要特征优先匹配
        // - 最终根据总分排序，推荐最相似的轴承型号
        // 评分维度（按重要性排序）：
        // 相似性匹配算法：系列相似性(最高权重)、尺寸匹配、格式特征、字符位置、618/619特殊处理
        let candidateList = []; // 存储所有候选型号及其相似度分数

        // 5.1 提取输入型号的关键特征
        // 提取型号中的前两位数字作为系列标识（例如：6204中的"62"）
        const inputSeries = modelInput.replace(/[^0-9]/g, '').substring(0, 2);

        // 检查输入型号是否包含斜杠（某些特殊轴承型号格式特征）
        const inputHasSlash = modelInput.includes('/');

        // 新增：提取所有数字，用于68/69系列的特殊处理
        const inputNumbers = modelInput.replace(/[^0-9]/g, '');

        // 5.2 遍历所有轴承型号，计算与用户输入的多维度相似度
        for (const [key, val] of Object.entries(bearingData)) {
          let score = 0; // 初始化相似度分数

          // 维度1: 系列相似性（最高权重，100分）
          // 提取候选型号的前两位数字作为系列标识
          const candidateSeries = key.replace(/[^0-9]/g, '').substring(0, 2);

          if (candidateSeries === inputSeries) {
            // 完全相同的系列，给予最高分数
            score += 100;
          } else if (candidateSeries.charAt(0) === inputSeries.charAt(0)) {
            // 同一大类但不同系列（如60系列和62系列都属于6大类）
            score += 50;
          }

          // 维度2: 格式相似性（中等权重，30分）
          // 检查候选型号是否与输入型号具有相同的格式特征（斜杠）
          const candidateHasSlash = key.includes('/');
          if (candidateHasSlash === inputHasSlash) {
            score += 30;
          }

          // 维度3: 型号长度相似性（动态权重，最多20分）
          // 长度差异越小，分数越高，差异超过20则不再扣分
          const lengthDiff = Math.abs(key.length - modelInput.length);
          score += Math.max(0, 20 - lengthDiff);

          // 维度4: 字符位置相似性（编辑距离的简化版，按匹配字符数计算）
          // 逐字符比较，相同位置的字符匹配给予加分
          let charMatch = 0;
          const minLength = Math.min(key.length, modelInput.length);
          for (let i = 0; i < minLength; i++) {
            if (key[i] === modelInput[i]) charMatch++;
          }
          score += charMatch * 2;

          // 新增：68/69系列特殊处理 - 如果输入是68/69系列，优先推荐对应的618/619系列
          if ((modelInput.startsWith('68') && key.startsWith('618')) ||
            (modelInput.startsWith('69') && key.startsWith('619'))) {
            // 检查数字部分是否匹配（去掉前缀后的部分）
            const inputSuffix = inputNumbers.substring(2);
            const candidateSuffix = key.replace(/[^0-9]/g, '').substring(3); // 618/619有3个字符前缀
            // 如果输入只有'68'/'69'（没有后缀），或者后缀匹配，都给予加分
            if (inputNumbers.length <= 2 || inputSuffix === candidateSuffix) {
              score += 150; // 给予很高的优先级
            }
          }

          // 将计算好相似度的候选型号添加到列表中
          candidateList.push({ model: key, bearing: val, score });
        }

        // 5.3 按相似度得分从高到低排序候选型号
        candidateList.sort((a, b) => b.score - a.score);

        // 取前6个最相似型号作为推荐结果
        const top6 = candidateList.slice(0, 6);

        // 取前6个最相似型号作为推荐结果
        const topRecommendations = candidateList.slice(0, 6);

        // 构建推荐结果HTML（美化显示）
        let html = `<div class="recommendation-container" style="padding: 15px; border-radius: 8px; background-color: #f8f9fa; border: 1px solid #e9ecef;">`;
        html += `<h3 style="margin-top: 0; color: #333;">未找到完全匹配的型号</h3>`;
        html += `<p style="color: #666;">为您推荐以下相似型号：</p>`;

        // 添加68/69系列的特殊提示
        if (modelInput.startsWith('68') || modelInput.startsWith('69')) {
          html += `<div style="padding: 10px; background-color: #e3f2fd; border-left: 4px solid #2196f3; margin-bottom: 15px;">`;
          html += `<p style="margin: 0; color: #1565c0;">提示：您输入的是${modelInput.startsWith('68') ? '68' : '69'}系列，系统已优先推荐对应的61${modelInput.startsWith('68') ? '8' : '9'}系列型号</p>`;
          html += `</div>`;
        }

        html += `<div class="recommendations-list" style="display: grid; gap: 10px;">`;

        topRecommendations.forEach(item => {
          const { d, D, B } = item.bearing;
          html += `<div class="recommendation-item" 
                    onclick="selectRecommendedModel('${item.model}')" 
                    style="cursor: pointer; padding: 12px; border-radius: 6px; border: 1px solid #dee2e6; transition: all 0.3s; background-color: white;">
                    <div class="recommendation-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                      <strong style="color: #2196f3; font-size: 16px;">${item.model}</strong>

                    </div>
                    <div class="recommendation-details" style="color: #555;">
                      尺寸: ${d}×${D}×${B} mm
                    </div>
                    <div class="recommendation-action" style="margin-top: 8px; text-align: right;">
                      <span style="font-size: 12px; color: #007bff; text-decoration: underline;">点击查看详情</span>
                    </div>
                  </div>`;
        });

        html += `</div>`;
        html += `<div style="margin-top: 15px; padding-top: 10px; border-top: 1px solid #dee2e6;">`;
        html += `<p style="font-size: 13px; color: #666; margin: 0;">提示：点击任意推荐型号可直接查看该型号的详细参数</p>`;
        html += `</div>`;
        html += `</div>`;

        resultDiv.innerHTML = html;
        resultDiv.style.display = "block";
      }

      // 线性插值函数
      function linearInterpolate(ratio, type) {
        // 如果比值超出数据范围，返回边界值
        if (ratio < fcF0Data[0].ratio) return fcF0Data[0][type];
        if (ratio > fcF0Data[fcF0Data.length - 1].ratio) return fcF0Data[fcF0Data.length - 1][type];

        // 找到比值所在的范围
        for (let i = 0; i < fcF0Data.length - 1; i++) {
          const current = fcF0Data[i];
          const next = fcF0Data[i + 1];

          if (ratio >= current.ratio && ratio <= next.ratio) {
            // 计算插值比例
            const t = (ratio - current.ratio) / (next.ratio - current.ratio);
            // 线性插值计算
            const value = current[type] + t * (next[type] - current[type]);
            return value;
          }
        }

        return null;
      }

      // 查找最接近的钢球尺寸
      function findClosestBallSize(target) {
        return ballSizes.reduce((prev, curr) => {
          return (Math.abs(curr - target) < Math.abs(prev - target) ? curr : prev);
        });
      }

      // 原来的简化钢球数量计算公式（作为备选）
      function calculateBallCountOld(centerDiameter, ballSize, kd) {
        const ratio = ballSize / (centerDiameter * (1 - kd));
        if (ratio >= 1) return null;
        return Math.floor(Math.PI / Math.asin(ratio));
      }

      // 计算钢球数量（精确公式）
      function calculateBallCount(centerDiameter, ballSize, kd) {
        const Dm = centerDiameter; // 中心圆直径
        const Dw = ballSize;       // 钢球尺寸
        const KD = kd;            // 外圈挡边系数

        // 检查参数有效性：确保所有参数都是正数且挡边系数在合理范围内
        if (Dm <= 0 || Dw <= 0 || KD <= 0 || KD >= 1) {
          return null;
        }

        try {
          // 计算 ACOS 的参数：基于轴承几何关系计算反余弦函数的参数
          const acosPart1 = Dm / (4 * (1 - KD) * Dw);
          const acosPart2 = 1 - (Math.pow(Dm, 2) - 4 * Math.pow((1 - KD) * Dw, 2)) / Math.pow(Dm, 2);
          const acosParam = acosPart1 * acosPart2;

          // 确保 ACOS 参数在有效范围内 [-1, 1]，超出范围说明几何关系不成立
          if (Math.abs(acosParam) > 1) {
            return null;
          }

          // 计算 ACOS 部分（弧度转角度）：计算钢球之间的角度关系
          const acosValue = Math.acos(acosParam) * 180 / Math.PI;

          // 计算 ASIN 部分：计算钢球与中心线的角度关系
          const asinParam = Dw / Dm;
          if (Math.abs(asinParam) > 1) {
            return null;
          }
          const asinValue = Math.asin(asinParam);

          // 应用完整公式：结合角度关系计算钢球数量
          const numerator = (180 - acosValue) * 2 * Math.PI;
          const denominator = 2 * 180 * asinValue;
          const ballCount = numerator / denominator + 1 - 0.4;

          // 四舍五入取整数：得到最终的钢球数量
          return Math.round(ballCount);

        } catch (error) {
          console.error("钢球数量计算错误:", error);
          return null;
        }
      }

      // 计算更多参数（挡边直径和额定载荷）
      function calculateMoreParams(model, bearing) {
        const { d, D, B, ballSize, ballCount, centerDiameter, rmin } = bearing;
        const moreParams = [];

        // 获取用户输入的挡边系数和钢球系数
        const kd = parseFloat(document.getElementById('kd').value) || 0.36;
        const kd_inner = parseFloat(document.getElementById('kd_inner').value) || 0.38;
        const kw = parseFloat(document.getElementById('kw').value) || 0.28;

        // 计算中心圆直径（如果没有数据就用平均值）
        const calculatedCenterDiameter = centerDiameter || (D + d) / 2;

        // 只在没有查表中心径时，在更多参数中显示计算的中心径
        if (!centerDiameter) {
          moreParams.push(['⭕ 中心径Dwp', `${calculatedCenterDiameter.toFixed(2)} mm`]);
        }

        // 智能计算钢球尺寸
        let calculatedBallSize = ballSize;

        if (!ballSize) {
          // 如果没有查表值，则计算钢球尺寸
          const theoreticalSize = kw * (D - d);
          calculatedBallSize = findClosestBallSize(theoreticalSize);
          // 修改：去掉"计算值"文字，只显示Kw系数
          moreParams.push(['🎱 钢球尺寸 Dw', `${calculatedBallSize} mm (Kw=${kw})`]);
        }

        // 智能计算钢球数量
        let calculatedBallCount = ballCount;

        if (!ballCount) {
          // 如果没有查表值，则计算钢球数量
          const calculatedCenterDiameter = centerDiameter || (D + d) / 2;

          // 先尝试使用新的精确公式
          calculatedBallCount = calculateBallCount(calculatedCenterDiameter, calculatedBallSize || ballSize, kd);

          // 如果新公式失败，使用原来的简化公式
          if (calculatedBallCount === null) {
            calculatedBallCount = calculateBallCountOld(calculatedCenterDiameter, calculatedBallSize || ballSize, kd);
          }

          if (calculatedBallCount !== null) {
            moreParams.push(['🔢 钢球数量 Z', `${calculatedBallCount} 个`]);
          }
        }

        // 检查是否有必要的参数来计算
        const effectiveBallSize = calculatedBallSize || ballSize;
        const effectiveBallCount = calculatedBallCount || ballCount;

        if (!effectiveBallSize || !effectiveBallCount) {
          return moreParams; // 如果没有钢球尺寸或数量，无法进行后续计算
        }

        // 1. 计算挡边直径
        let D2 = null;
        let d2 = null;

        if (kd >= 0 && kd <= 1) {
          D2 = calculatedCenterDiameter + effectiveBallSize * (1 - kd);
          moreParams.push(['📐 外圈挡边D2', `${D2.toFixed(2)} mm (KD=${kd})`]);
        }

        if (kd_inner >= 0 && kd_inner <= 1) {
          d2 = calculatedCenterDiameter - effectiveBallSize * (1 - kd_inner);
          moreParams.push(['📐 内圈挡边d2', `${d2.toFixed(2)} mm (Kd=${kd_inner})`]);
        }

        // 2. 计算轴向游隙Gr参数
        if (effectiveBallSize) {
          // 获取当前选择的游隙组别
          const clearance = document.querySelector('input[name="clearance"]:checked')?.value;
          if (clearance) {
            // 根据轴承内径查找对应的游隙范围
            const cr = findInRanges(d, clearanceRanges, clearance);
            if (cr) {
              // 解析径向游隙的最小值和最大值（μm）
              const [minRadialClearance, maxRadialClearance] = cr.split('～').map(val => parseFloat(val));

              if (!isNaN(minRadialClearance) && !isNaN(maxRadialClearance)) {
                // 将径向游隙转换为mm单位
                const minRadialClearanceMM = minRadialClearance / 1000;
                const maxRadialClearanceMM = maxRadialClearance / 1000;

                try {
                  // 计算轴向游隙最小值
                  const minParam = 1 - minRadialClearanceMM / (2 * 0.03 * effectiveBallSize);
                  const minAcos = Math.acos(Math.max(-1, Math.min(1, minParam))); // 确保参数在[-1,1]范围内
                  const minAxialClearanceMM = 2 * effectiveBallSize * 0.03 * Math.sin(minAcos);

                  // 计算轴向游隙最大值
                  const maxParam = 1 - maxRadialClearanceMM / (2 * 0.03 * effectiveBallSize);
                  const maxAcos = Math.acos(Math.max(-1, Math.min(1, maxParam))); // 确保参数在[-1,1]范围内
                  const maxAxialClearanceMM = 2 * effectiveBallSize * 0.03 * Math.sin(maxAcos);

                  // 转换为μm并添加到结果中
                  const minAxialClearanceUM = Math.round(minAxialClearanceMM * 1000);
                  const maxAxialClearanceUM = Math.round(maxAxialClearanceMM * 1000);

                  moreParams.push(['🔄 轴向游隙Gr', `${minAxialClearanceUM}～${maxAxialClearanceUM} μm`]);
                } catch (error) {
                  console.error('计算轴向游隙时出错:', error);
                }
              }
            }
          }
        }

        // 3. 计算轴承质量（仅在挡边直径和必要参数都可用时计算）
        if (effectiveBallSize && effectiveBallCount && calculatedCenterDiameter && rmin && D2 !== null && d2 !== null) {
          // 计算外圈质量
          const De = calculatedCenterDiameter + effectiveBallSize;
          const Re = 0.52 * effectiveBallSize;
          const outerMass = 7.83 * (
            0.785 * (Math.pow(D, 2) - Math.pow(D2, 2)) * B -
            1.349 * D * Math.pow(rmin, 2) -
            2.245 * Math.pow(0.5, 2) * D2 -
            1.345 * De * Math.pow(Re, 2) +
            0.6176 * Math.pow(Re, 3)
          ) / 1000;

          // 计算内圈质量
          const di = calculatedCenterDiameter - effectiveBallSize;
          const Ri = 0.515 * effectiveBallSize;
          const innerMass = 7.83 * (
            0.785 * (Math.pow(d2, 2) - Math.pow(d, 2)) * B -
            2.245 * d2 * Math.pow(0.5, 2) -
            1.349 * d * Math.pow(rmin, 2) -
            1.345 * di * Math.pow(Ri, 2) -
            0.6176 * Math.pow(Ri, 3)
          ) / 1000;

          // 计算钢球质量
          const ballVolume = (4 / 3) * Math.PI * Math.pow(effectiveBallSize / 2, 3);
          const ballMass = 7.83 * ballVolume / 1000 * effectiveBallCount;

          // 计算总质量，包含保持架质量计算
          const sqrtTerm = Math.sqrt(effectiveBallSize / 3 + 1.5625) - 1.25;
          const cageMassPart1 = 5.969925 / 1000 * Math.PI * (calculatedCenterDiameter + 0.36388 * effectiveBallCount * (effectiveBallSize * 0.515 + sqrtTerm / 2)) * effectiveBallSize * sqrtTerm;
          const cageMassPart2 = Math.PI * sqrtTerm * 4.5184 / 1000 * effectiveBallCount;
          const totalMass = outerMass + innerMass + ballMass + (cageMassPart1 + cageMassPart2);

          moreParams.push(['⚖️ 轴承质量M', `${totalMass.toFixed(1)} g`]);
        }

        // 4. 计算额定载荷
        if (calculatedCenterDiameter > 0) {
          // 获取用户输入的材料系数、滚珠列数和角接触角
          const bm = parseFloat(document.getElementById('bm').value) || 1.3;
          const i = parseFloat(document.getElementById('i').value) || 1;
          const alpha = parseFloat(document.getElementById('alpha').value) || 0;

          // 计算cosα
          const cosAlpha = Math.cos(alpha * Math.PI / 180); // 将角度转换为弧度后计算余弦值

          // 修改ratio的计算公式为：钢球尺寸*cosα/中心径尺寸
          const ratio = (effectiveBallSize * cosAlpha) / calculatedCenterDiameter;
          const fcValue = linearInterpolate(ratio, 'fc');
          const f0Value = linearInterpolate(ratio, 'f0');

          if (fcValue && f0Value) {
            let Cr;
            // 根据钢球尺寸选择不同的计算公式，并应用新的材料系数和滚珠列数因子
            if (effectiveBallSize <= 25.4) {
              Cr = bm * fcValue * Math.pow(effectiveBallCount, 2 / 3) * Math.pow(effectiveBallSize, 1.8) * Math.pow(i * cosAlpha, 0.7);
            } else {
              Cr = 3.647 * bm * fcValue * Math.pow(effectiveBallCount, 2 / 3) * Math.pow(effectiveBallSize, 1.4) * Math.pow(i * cosAlpha, 0.7);
            }

            // 添加到结果中（转换为KN）
            moreParams.push(['⚡额定动载荷Cr', `${(Cr / 1000).toFixed(2)} KN`]);

            // 计算径向基本额定静载荷 C0r，并乘以滚珠列数i*cosα
            const C0r = f0Value * effectiveBallCount * Math.pow(effectiveBallSize, 2) * i * cosAlpha;
            moreParams.push(['⚡额定静载荷Cor', `${(C0r / 1000).toFixed(2)} KN`]);
          }
        }
        return moreParams;
      }

      /**
       * 通用型号匹配函数
       * @param {string} inputModel - 输入的型号（可能包含=前缀）
       * @param {string} targetModel - 目标型号（数据库中的型号）
       * @returns {boolean} - 是否匹配
       */
      function matchModel(inputModel, targetModel) {
        if (!inputModel) return true; // 空输入视为匹配

        if (inputModel.startsWith('=')) {
          // 精确匹配模式
          const exactModel = inputModel.substring(1);
          return targetModel === exactModel;
        } else {
          // 模糊匹配模式
          return targetModel.includes(inputModel);
        }
      }

      /**
       * 生成型号匹配的条件描述
       * @param {string} model - 输入的型号（可能包含=前缀）
       * @returns {string} - 条件描述文本
       */
      function getModelConditionDesc(model) {
        if (!model) return '';

        if (model.startsWith('=')) {
          return `产品型号等于"${model.substring(1)}"`;
        } else {
          return `产品型号包含"${model}"`;
        }
      }

      function initializeProcessData() {
        try {
          filteredProcessData = [...bearingProcessData];
          currentProcessPage = 1;
          renderProcessResults();
          renderProcessPagination();
          const totalCountElement = document.getElementById('processTotalCount');
          if (totalCountElement) {
            totalCountElement.textContent = bearingProcessData.length;

        } catch (error) {

      }

      // 搜索工艺参数数据
      function searchProcessData() {
        try {
          const customerInput = document.getElementById('processCustomer');
          const modelInput = document.getElementById('processModel');
          const salespersonInput = document.getElementById('processSalesperson');

          if (!customerInput || !modelInput || !salespersonInput) {
            console.error('找不到查询输入框');
            alert('页面元素加载不完整，请刷新页面后重试。');
            return;
          }

          const customer = customerInput.value.trim();
          const model = modelInput.value.trim();
          const salesperson = salespersonInput.value.trim();

          // 如果型号输入框有内容，显示相关型号建议
          if (model) {
            showModelSuggestions();
          }

          // 数据过滤
          filteredProcessData = bearingProcessData.filter(item => {
            try {
              const matchCustomer = !customer || (item['客户名称'] && item['客户名称'].includes(customer));
              // 型号匹配逻辑（使用通用匹配函数）
              const productModel = item['产品型号'] || '';
              const modelMatched = matchModel(model, productModel);
              const matchSalesperson = !salesperson || (item['销售员'] && item['销售员'].includes(salesperson));
              return matchCustomer && modelMatched && matchSalesperson;
            } catch (filterError) {
              console.error('过滤数据时出错:', filterError);
              return false;
            }
          });

          currentProcessPage = 1;
          renderProcessResults();
          renderProcessPagination();

          // 如果所有输入框都为空，重新显示分页控件
          if (!customer && !model && !salesperson) {
            const paginationElement = document.getElementById('processPagination');
            if (paginationElement) {
              paginationElement.style.display = '';
            }
          }

          const totalCountElement = document.getElementById('processTotalCount');
          if (totalCountElement) {
            totalCountElement.textContent = filteredProcessData.length;
          }
        } catch (error) {
          console.error('工艺参数查询时出错:', error);
          alert('查询过程中发生错误，请查看控制台了解详情。');
        }
      }

        }

       * 处理工艺参数输入框的自动查询功能（防抖500ms）
       */
      let processSearchTimeout;
      function handleProcessInputAutoSearch() {
        // 清除之前的定时器
        clearTimeout(processSearchTimeout);

        // 设置新的定时器，延迟500ms执行查询
        processSearchTimeout = setTimeout(function () {

          searchProcessData();

      /**

       */
      function showModelSuggestions() {
        try {
          const modelInput = document.getElementById('processModel');
          if (!modelInput) return;

          const inputValue = modelInput.value.trim();
          if (!inputValue) {
            // 如果输入为空，清除之前的建议
            const existingSuggestions = document.getElementById('modelSuggestionsContainer');
            if (existingSuggestions) {
              existingSuggestions.remove();
            }
            return;
          }

          // 搜索匹配的型号（支持精确匹配和模糊匹配）
          const matchingModels = new Set();
          bearingProcessData.forEach(item => {
            const productModel = item['产品型号'] || '';
            if (productModel) {
              // 使用通用匹配函数
              if (matchModel(inputValue, productModel)) {
                matchingModels.add(productModel);
              }
            }
          });

          if (matchingModels.size === 0) return;

          // 如果只有一个匹配的型号，不显示建议
          if (matchingModels.size === 1) {
            // 移除之前的建议容器
            const existingSuggestions = document.getElementById('modelSuggestionsContainer');
            if (existingSuggestions) {
              existingSuggestions.remove();
            }
            return;
          }

          // 移除之前的建议容器
          const existingSuggestions = document.getElementById('modelSuggestionsContainer');
          if (existingSuggestions) {
            existingSuggestions.remove();
          }

          // 创建建议容器
          const suggestionsContainer = document.createElement('div');
          suggestionsContainer.id = 'modelSuggestionsContainer';
          suggestionsContainer.style.margin = '10px 0';
          suggestionsContainer.style.padding = '10px';
          suggestionsContainer.style.backgroundColor = 'rgba(46, 204, 113, 0.1)';
          suggestionsContainer.style.borderRadius = '5px';
          suggestionsContainer.style.color = '#2ecc71';
          suggestionsContainer.style.width = '100%';
          suggestionsContainer.style.boxSizing = 'border-box';

          // 构建建议型号的HTML，添加点击事件
          const modelsArray = Array.from(matchingModels).slice(0, 20); // 限制显示前20个
          const modelsHTML = modelsArray.map(m =>
            `<span style="color: #3498db; cursor: pointer; display: inline-block;" onclick="selectModelSuggestion('${m}')">${m}</span>`
          ).join('、');

          suggestionsContainer.innerHTML = `相关型号：${modelsHTML}`;

          // 在整个参数行容器下方插入建议
          const paramsRowContainers = document.querySelectorAll('.params-row-container');
          const searchFormRow = paramsRowContainers[0]; // 第一个参数行容器是搜索表单
          if (searchFormRow) {
            // 在搜索表单行后插入建议
            searchFormRow.parentNode.insertBefore(suggestionsContainer, searchFormRow.nextSibling);
          } else {
            // 如果没有找到参数行容器，就退回到在输入框下方插入
            modelInput.parentNode.insertBefore(suggestionsContainer, modelInput.nextSibling);
          }
        } catch (error) {
          console.error('显示型号建议时出错:', error);
        }
      }

          const suggestionsContainer = document.getElementById('modelSuggestionsContainer');

      /**
       * 显示径向游隙统计与关联查询结果
       * 修复安卓程序中需要点击两次的问题：
       * 1. 清除自动查询定时器，避免输入框的自动查询与按钮点击冲突
       * 2. 确保使用最新的输入值进行游隙统计
       */
      function showClearanceStatistics() {
        try {
          // 清除自动查询定时器，避免与游隙统计冲突
          clearTimeout(processSearchTimeout);

          const modelInput = document.getElementById('processModel');
          const customerInput = document.getElementById('processCustomer');
          const salespersonInput = document.getElementById('processSalesperson');

          if (!modelInput || !customerInput || !salespersonInput) {
            console.error('找不到输入框元素');
            alert('页面元素加载不完整，请刷新页面后重试。');
            return;
          }

          // 获取所有输入值
          const model = modelInput.value.trim();
          const customer = customerInput.value.trim();
          const salesperson = salespersonInput.value.trim();

          // 如果所有输入框都为空，提示用户至少输入一个条件
          if (!model && !customer && !salesperson) {
            alert('请至少输入一个查询条件：产品型号、客户名称或销售员');
            return;
          }

          // 数据过滤 - 基于多条件联合筛选
          const matchingRecords = bearingProcessData.filter(item => {
            try {
              // 获取产品型号、客户名称和销售员信息
              const productModel = item['产品型号'] || '';
              const itemCustomer = item['客户名称'] || '';
              const itemSalesperson = item['销售员'] || '';

              // 所有非空条件都必须满足
              const modelMatched = matchModel(model, productModel);
              let matchCustomer = !customer || itemCustomer.includes(customer);
              let matchSalesperson = !salesperson || itemSalesperson.includes(salesperson);

              // 返回同时满足所有条件的结果
              return modelMatched && matchCustomer && matchSalesperson;
            } catch (error) {
              console.error('过滤数据时出错:', error);
              return false;
            }
          });

          // 生成查询条件描述字符串
          let conditionDesc = getModelConditionDesc(model);
          if (customer) {
            conditionDesc += conditionDesc ? `、客户名称包含"${customer}"` : `客户名称包含"${customer}"`;
          }
          if (salesperson) {
            conditionDesc += conditionDesc ? `、销售员包含"${salesperson}"` : `销售员包含"${salesperson}"`;
          }

          if (matchingRecords.length === 0) {
            alert(`未找到与以下条件相关的记录：${conditionDesc}`);
            return;
          }

          // 按径向游隙和轴向游隙分组并统计客户信息
          const clearanceMap = new Map();

          matchingRecords.forEach(record => {
            const radialClearance = record['径向游隙'] || '未指定';
            const axialClearance = record['轴向游隙'] || '未指定';
            // 使用组合键作为Map的键
            const clearanceKey = `${radialClearance}|${axialClearance}`;
            const customer = record['客户名称'] || '未知客户';

            if (!clearanceMap.has(clearanceKey)) {
              clearanceMap.set(clearanceKey, {
                radialClearance: radialClearance,
                axialClearance: axialClearance,
                customers: new Set()
              });
            }

            clearanceMap.get(clearanceKey).customers.add(customer);
          });

          // 显示统计结果
          displayClearanceStatistics(clearanceMap, conditionDesc);
        } catch (error) {
          console.error('显示游隙统计时出错:', error);
          alert('统计过程中发生错误，请查看控制台了解详情。');
        }
      }

          // 创建表头
          headerConfigs.forEach(config => {
            const th = document.createElement('th');
            th.textContent = config.text;
            th.style.width = config.width;
            th.style.minWidth = config.minWidth || 'auto';
            th.style.padding = '12px';
            th.style.textAlign = 'center';
            th.style.borderBottom = '2px solid #2ecc71';
            th.style.fontWeight = 'bold';
            th.style.whiteSpace = 'nowrap';

            // 为客户清单表头添加标识
            if (config.text === '客户清单') {
              th.id = 'customers-header';
              th.classList.add('customers-header');
            }

            headerRow.appendChild(th);
          });

          thead.appendChild(headerRow);
          table.appendChild(thead);
          const tbody = document.createElement('tbody');
          let index = 1;

          // 将Map转换为数组并按径向游隙值排序
          const sortedClearances = Array.from(clearanceMap.entries())
            .sort((a, b) => a[0].localeCompare(b[0]));

          // 处理长文本内容的函数
          function setupTextExpansion(element, fullText) {
            const lineHeight = parseInt(window.getComputedStyle(element).lineHeight) || 20;
            const contentHeight = element.offsetHeight;
            const lineCount = Math.ceil(contentHeight / lineHeight);

            if (lineCount > 2) {
              const parentCell = element.closest('td');
              if (parentCell) {
                parentCell.style.cursor = 'pointer';

                // 设置初始截断样式
                element.style.overflow = 'hidden';
                element.style.display = '-webkit-box';
                element.style.webkitLineClamp = '2';
                element.style.webkitBoxOrient = 'vertical';
                element.style.lineHeight = lineHeight + 'px';
                element.style.textOverflow = 'ellipsis';

                // 添加点击展开/收起功能
                let isExpanded = false;
                parentCell.addEventListener('click', function (e) {
                  e.stopPropagation();

                  // 切换展开/收起状态
                  const isNowExpanded = !isExpanded;
                  element.style.overflow = isNowExpanded ? 'visible' : 'hidden';
                  element.style.display = isNowExpanded ? 'block' : '-webkit-box';
                  element.style.webkitLineClamp = isNowExpanded ? 'unset' : '2';
                  element.style.webkitBoxOrient = isNowExpanded ? 'unset' : 'vertical';

                  isExpanded = isNowExpanded;
                });
              }
            }
          }

          // 窗口大小变化处理函数
          function handleWindowResize(type = 'clearance') {
            const columnWidthThreshold = type === 'clearance' ? 200 : 150;
            const container = document.getElementById('processResultsContainer');
            if (!container) return;

            const isClearance = type === 'clearance';
            const allCustomerCells = container.querySelectorAll(isClearance ? 'td.customer-cell' : 'td:last-child');
            const header = document.getElementById(isClearance ? 'customers-header' : 'vibration-customers-header');
            const rows = container.querySelectorAll('tbody tr');

            // 检查第一个客户单元格的宽度
            const firstCustomerCell = rows[0]?.querySelector(isClearance ? 'td.customer-cell' : 'td:last-child');
            const shouldHideColumn = firstCustomerCell && firstCustomerCell.offsetWidth < columnWidthThreshold;

            // 批量更新所有元素
            allCustomerCells.forEach(cell => {
              if (isClearance) {
                cell.style.display = shouldHideColumn ? 'none' : '';
              } else {
                // 振动统计的特殊处理
                const contentContainer = cell.querySelector('div');
                if (shouldHideColumn && contentContainer && contentContainer.dataset.fullContent) {
                  const customersArray = JSON.parse(cell.closest('tr').dataset.customersArray || '[]');
                  contentContainer.textContent = `${customersArray.length}个客户`;
                  contentContainer.style.fontWeight = 'bold';
                  contentContainer.style.color = '#e67e22';
                  contentContainer.style.cursor = 'pointer';
                } else if (contentContainer && contentContainer.dataset.fullContent) {
                  contentContainer.textContent = contentContainer.dataset.fullContent;
                  contentContainer.style.fontWeight = '';
                  contentContainer.style.color = '';
                  contentContainer.style.cursor = '';
                }
                cell.style.display = '';
              }
            });

            if (header) {
              header.style.display = shouldHideColumn ? 'none' : '';
            }

            // 设置行的点击状态
            rows.forEach(row => {
              if (shouldHideColumn) {
                row.style.cursor = 'pointer';
                row.classList.add(isClearance ? 'customer-popup-row' : 'vibration-customer-popup-row');
              } else {
                row.style.cursor = '';
                row.classList.remove(isClearance ? 'customer-popup-row' : 'vibration-customer-popup-row');
              }
            });
          }

          // 确保只添加一次窗口大小变化监听器
          if (!window.customerColumnResizeHandler) {
            window.customerColumnResizeHandler = handleWindowResize;
            window.addEventListener('resize', handleWindowResize);
          }

          // 填充表格数据
          sortedClearances.forEach(([clearance, data]) => {
            const row = document.createElement('tr');
            row.style.borderBottom = '1px solid rgba(255, 255, 255, 0.1)';
            row.style.transition = 'background-color 0.2s';
            row.onmouseover = () => row.style.backgroundColor = 'rgba(46, 204, 113, 0.1)';
            row.onmouseout = () => row.style.backgroundColor = 'transparent';

            // 添加序号单元格
            row.appendChild(createTableCell(index++, {
              styles: {
                minWidth: '30px'
              }
            }));

            // 添加径向游隙单元格（如果有有效值）
            if (hasValidRadialClearance) {
              row.appendChild(createTableCell(data.radialClearance, {
                styles: {
                  fontWeight: 'bold',
                  color: '#2ecc71'
                }
              }));
            }

            // 添加轴向游隙单元格（如果有有效值）
            if (hasValidAxialClearance) {
              row.appendChild(createTableCell(data.axialClearance, {
                styles: {
                  fontWeight: 'bold',
                  color: '#3498db'
                }
              }));
            }

            // 处理客户列表显示
            const customersArray = Array.from(data.customers);
            const customersList = customersArray.join(', ');

            if (shouldShowCustomersColumn) {
              // 创建客户列表单元格
              const customersCell = document.createElement('td');
              customersCell.classList.add('customer-cell');
              customersCell.style.width = '100%';
              customersCell.style.padding = '8px 8px';
              customersCell.style.verticalAlign = 'top';
              customersCell.style.wordWrap = 'break-word';
              customersCell.style.overflowWrap = 'break-word';

              // 创建内容容器
              const contentContainer = document.createElement('div');
              contentContainer.textContent = customersList;
              contentContainer.dataset.fullContent = customersList;
              customersCell.appendChild(contentContainer);

              // 异步检查并设置文本展开功能
              const cellId = 'customer-cell-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
              contentContainer.id = cellId;

              setTimeout(() => {
                const element = document.getElementById(cellId);
                if (element) {
                  setupTextExpansion(element, customersList);
                }
              }, 100);

              row.appendChild(customersCell);
            } else {
              // 移动设备：设置行为可点击，准备弹窗显示
              row.dataset.customersList = customersList;
              row.dataset.customersArray = JSON.stringify(customersArray);
              row.style.cursor = 'pointer';
              row.classList.add('customer-popup-row');

              // 添加点击事件显示弹窗
              row.addEventListener('click', function (e) {
                if (!e.target.closest('button') && !e.target.closest('a') && !e.target.closest('input')) {
                  showCustomersPopup(this);
                }
              });
            }

            tbody.appendChild(row);
          });

          table.appendChild(tbody);
          container.appendChild(table);

          // 添加客户列表弹窗的HTML结构（如果还不存在）
          if (!document.getElementById('customers-popup')) {
            const popupHTML = `
              <div id="customers-popup" class="customers-popup">
                <div class="popup-header">
                  <h3 class="popup-title">客户列表</h3>
                  <span id="close-popup" class="popup-close">×</span>
                </div>
                <div id="popup-customers-content" class="popup-content"></div>
              </div>
              <div id="popup-overlay" class="popup-overlay"></div>
            `;
            document.body.insertAdjacentHTML('beforeend', popupHTML);

            // 添加弹窗关闭事件
            document.getElementById('close-popup').addEventListener('click', function () {
              hideCustomersPopup();
            });

            document.getElementById('popup-overlay').addEventListener('click', function () {
              hideCustomersPopup();
            });

            // 添加鼠标悬停效果
            document.getElementById('close-popup').addEventListener('mouseenter', function () {
              this.style.backgroundColor = 'var(--hover-bg)';
            });

            document.getElementById('close-popup').addEventListener('mouseleave', function () {
              this.style.backgroundColor = 'transparent';
            });
          }

          /**
       * 根据精确型号筛选游隙状态
       * @param {string} exactModel - 精确的轴承型号
       */
          window.filterByExactModel = function (exactModel) {
            try {
              // 获取客户名称和销售员输入框的值
              const customer = document.getElementById('processCustomer')?.value.trim() || '';
              const salesperson = document.getElementById('processSalesperson')?.value.trim() || '';

              // 搜索完全匹配该型号且满足客户和销售员筛选条件的记录
              const exactMatchingRecords = bearingProcessData.filter(item => {
                const matchModel = item['产品型号'] && item['产品型号'] === exactModel;
                const matchCustomer = !customer || (item['客户名称'] && item['客户名称'].includes(customer));
                const matchSalesperson = !salesperson || (item['销售员'] && item['销售员'].includes(salesperson));
                return matchModel && matchCustomer && matchSalesperson;
              });

              if (exactMatchingRecords.length === 0) {
                alert(`未找到型号"${exactModel}"的记录`);
                return;
              }

              // 按径向游隙和轴向游隙分组并统计客户信息
              const filteredClearanceMap = new Map();

              exactMatchingRecords.forEach(record => {
                const radialClearance = record['径向游隙'] || '未指定';
                const axialClearance = record['轴向游隙'] || '未指定';
                const clearanceKey = `${radialClearance}|${axialClearance}`;
                const customer = record['客户名称'] || '未知客户';

                if (!filteredClearanceMap.has(clearanceKey)) {
                  filteredClearanceMap.set(clearanceKey, {
                    radialClearance: radialClearance,
                    axialClearance: axialClearance,
                    customers: new Set()
                  });
                }

                filteredClearanceMap.get(clearanceKey).customers.add(customer);
              });

              // 构建查询条件描述
              let conditionDesc = `型号"${exactModel}"`;
              if (customer) {
                conditionDesc += `、客户名称包含"${customer}"`;
              }
              if (salesperson) {
                conditionDesc += `、销售员包含"${salesperson}"`;
              }

              // 显示筛选后的统计结果
              displayClearanceStatistics(filteredClearanceMap, conditionDesc, new Set([exactModel]));

              // 筛选后重新触发窗口大小变化处理，确保客户列显示正确
              setTimeout(() => {
                if (window.customerColumnResizeHandler) {
                  window.customerColumnResizeHandler();
                }
              }, 200);
            } catch (error) {
              console.error('按型号筛选时出错:', error);
              alert('筛选过程中发生错误，请查看控制台了解详情。');
            }
          }

          // 显示客户列表弹窗的函数（工艺参数专用）
          window.showCustomersPopup = function (rowElement) {
            showCustomersPopupCommon(rowElement, 'process');
          };

          // 隐藏客户列表弹窗的函数（工艺参数专用）
          window.hideCustomersPopup = function () {
            hideCustomersPopupCommon('process');
          };

          // 更新总数显示
          const totalCountElement = document.getElementById('processTotalCount');
          if (totalCountElement) {
            totalCountElement.textContent = ` ${clearanceMap.size} `;
          }

          // 隐藏分页控件
          const paginationElement = document.getElementById('processPagination');
          if (paginationElement) {
            paginationElement.style.display = 'none';
          }
        } catch (error) {
          console.error('显示统计结果表格时出错:', error);
          alert('显示统计结果时发生错误，请查看控制台了解详情。');
        }
      }

      // 工艺参数分页相关变量
      let filteredProcessData = [];
      const ITEMS_PER_PAGE_PROCESS = 16;
      let currentProcessPage = 1;

      // 渲染工艺参数查询结果
      function renderProcessResults() {
        try {
          // 检查数据是否已加载
          if (bearingProcessData.length === 0) {
            const container = document.getElementById('processResultsContainer');
            if (container) {
              container.innerHTML = '<div style="padding: 20px; text-align: center; color: #f39c12;">轴承工艺数据尚未加载，请等待...</div>';
            }
            return;
          }
          const container = document.getElementById('processResultsContainer');
          if (!container) {
            console.error('找不到工艺参数结果容器');
            return;
          }

          // 清空容器
          container.innerHTML = '';

          // 如果没有数据
          if (!filteredProcessData || filteredProcessData.length === 0) {
            // 获取用户输入的产品型号
            const modelInput = document.getElementById('processModel');
            const model = modelInput ? modelInput.value.trim() : '';

            // 特殊处理：68XX和69XX系列推荐对应的618XX和619XX系列
            let specialRecommendations = [];
            const match68XX = model.match(/^68(\d{2,})$/);
            const match69XX = model.match(/^69(\d{2,})$/);

            if (match68XX) {
              const suffix = match68XX[1];
              // 查找所有618XX系列的型号
              for (const item of bearingProcessData) {
                const productModel = item['产品型号'];
                if (productModel && productModel.match(new RegExp(`^618${suffix}`))) {
                  specialRecommendations.push(item);
                }
              }
            } else if (match69XX) {
              const suffix = match69XX[1];
              // 查找所有619XX系列的型号
              for (const item of bearingProcessData) {
                const productModel = item['产品型号'];
                if (productModel && productModel.match(new RegExp(`^619${suffix}`))) {
                  specialRecommendations.push(item);
                }
              }
            }

            // 如果有特殊推荐，显示推荐结果（以表格形式展示）
            if (specialRecommendations.length > 0) {
              // 检测屏幕宽度决定布局，只需判断是否为桌面端
              const isDesktop = window.innerWidth >= 768;  // 中等屏幕及以上为桌面端

              // 创建表格
              const table = document.createElement('table');
              table.className = 'process-table';
              // 添加特殊推荐表格的样式类
              table.classList.add('recommendation-table');
              // 保留CSS中未定义的关键样式
              table.style.borderCollapse = 'separate';
              table.style.borderSpacing = '0';

              // 创建表头
              const thead = document.createElement('thead');
              const headerRow = document.createElement('tr');

              // 根据屏幕宽度决定列数
              let headers = ['客户名称', '产品型号'];
              if (isDesktop) {
                // 电脑界面显示4列，每行显示两个客户名称和两个产品型号
                headers = ['客户名称', '产品型号', '客户名称', '产品型号'];
              }
              headers.forEach(headerText => {
                const th = document.createElement('th');
                th.textContent = headerText;
                headerRow.appendChild(th);
              });

              thead.appendChild(headerRow);
              table.appendChild(thead);

              // 创建表体
              const tbody = document.createElement('tbody');

              // 单元格样式设置函数
              function setTableCellStyle(cell, maxWidth = null) {
                if (maxWidth) {
                  cell.style.maxWidth = maxWidth;
                }
              }

              // 添加单元格点击事件的辅助函数
              function addCellClickListener(cell, productModel) {
                cell.addEventListener('click', () => {
                  try {
                    selectProcessRecommendedModel(productModel);
                  } catch (detailError) {
                    console.error('选择推荐型号时出错:', detailError);
                  }
                });
              }

              // 为数据项创建单元格的辅助函数
              function createItemCells(tr, item, maxWidth) {
                if (item) {
                  const customerCell = document.createElement('td');
                  customerCell.textContent = item['客户名称'] || '-';
                  setTableCellStyle(customerCell, maxWidth);
                  tr.appendChild(customerCell);

                  const modelCell = document.createElement('td');
                  modelCell.textContent = item['产品型号'] || '-';
                  setTableCellStyle(modelCell, maxWidth);
                  tr.appendChild(modelCell);

                  // 添加点击事件
                  addCellClickListener(customerCell, item['产品型号']);
                  addCellClickListener(modelCell, item['产品型号']);
                } else {
                  // 添加空单元格
                  const emptyCell = document.createElement('td');
                  emptyCell.colSpan = 2;
                  setTableCellStyle(emptyCell);
                  tr.appendChild(emptyCell);
                }
              }

              if (isDesktop) {
                // 电脑界面：每行显示两个数据项
                for (let i = 0; i < specialRecommendations.length; i += 2) {
                  try {
                    const tr = document.createElement('tr');
                    tr.style.transition = 'background-color 0.3s ease';

                    // 创建第一个和第二个数据项的单元格
                    createItemCells(tr, specialRecommendations[i], '120px');
                    createItemCells(tr, specialRecommendations[i + 1], '120px');

                    tbody.appendChild(tr);
                  } catch (rowError) {
                    console.error('创建行时出错:', rowError);
                  }
                }
              } else {
                // 移动端：每行显示一个数据项
                specialRecommendations.forEach((item) => {
                  try {
                    const tr = document.createElement('tr');
                    tr.style.transition = 'background-color 0.3s ease';

                    const customerCell = document.createElement('td');
                    customerCell.textContent = (item && item['客户名称']) || '-';
                    setTableCellStyle(customerCell, '150px');
                    tr.appendChild(customerCell);

                    const modelCell = document.createElement('td');
                    modelCell.textContent = (item && item['产品型号']) || '-';
                    setTableCellStyle(modelCell, '150px');
                    tr.appendChild(modelCell);

                    // 添加点击事件到整行
                    tr.addEventListener('click', () => {
                      try {
                        if (item) {
                          selectProcessRecommendedModel(item['产品型号']);
                        }
                      } catch (detailError) {
                        console.error('选择推荐型号时出错:', detailError);
                      }
                    });

                    tbody.appendChild(tr);
                  } catch (rowError) {
                    console.error('创建行时出错:', rowError);
                  }
                });
              }

              table.appendChild(tbody);

              // 创建推荐结果容器
              const recommendationContainer = document.createElement('div');
              recommendationContainer.style.padding = '20px';

              // 添加标题
              const title = document.createElement('p');
              title.innerHTML = `<p style="color: #e74c3c; text-align: center;">未找到产品型号 "${model}" 的工艺参数！</p>`;
              title.style.marginBottom = '15px';
              recommendationContainer.appendChild(title);

              // 添加说明
              const description = document.createElement('p');
              description.innerHTML = '<p style="text-align: center; color: #ccc;">为您推荐以下相似型号的工艺参数：</p>';
              description.style.marginBottom = '15px';
              recommendationContainer.appendChild(description);

              // 添加表格
              recommendationContainer.appendChild(table);

              // 添加提示
              const tip = document.createElement('p');
              tip.innerHTML = '<p style="margin-top: 20px; text-align: center; font-size: 0.9em; color: #bbb;">提示：您输入的型号可能应为上述推荐型号之一，点击型号可直接查询。</p>';
              recommendationContainer.appendChild(tip);

              container.appendChild(recommendationContainer);

              // 添加全局函数用于处理推荐型号选择
              window.selectProcessRecommendedModel = function (recommendedModel) {
                const modelInput = document.getElementById('processModel');
                if (modelInput) {
                  modelInput.value = recommendedModel;
                  searchProcessData();
                }
              };

              return;
            } else {
              container.innerHTML = '<div style="text-align: center; padding: 40px; color: #ccc;">未找到匹配的工艺参数</div>';
              return;
            }
          }

          // 获取当前页数据
          const startIndex = (currentProcessPage - 1) * ITEMS_PER_PAGE_PROCESS;
          const pageData = filteredProcessData.slice(startIndex, startIndex + ITEMS_PER_PAGE_PROCESS);

          // 检测屏幕宽度决定布局（仅保留需要的变量）
          const isDesktop = window.innerWidth >= 768; // 中等屏幕及以上

          // 添加卡片式布局的CSS样式 - 精简版，确保默认主题和亮色主题下只有颜色差异
          if (!document.getElementById('card-layout-styles')) {
            const styleSheet = document.createElement('style');
            styleSheet.id = 'card-layout-styles';
            styleSheet.textContent = `
              /* 通用布局 */

                border-radius: 12px;
                padding: 16px;
                margin-bottom: 12px;
                display: block;
                width: 100%;

              }
              
              .card-specs {

                font-size: 13px;

              }

              .card-clearance {

                color: #00a8ff;

              .card-container {

                flex-direction: column;

      // 创建详情表格的辅助函数
      function createDetailTable(item, fields, tableId) {
        const table = document.createElement('table');
        table.id = tableId;
        table.className = 'process-detail-table';
        table.style.width = '100%';
        table.style.borderCollapse = 'separate';
        table.style.borderSpacing = '0';
        table.style.marginTop = '0';

        // 过滤掉空值项，并只保留指定字段
        const validEntries = Object.entries(item)
          .filter(([key, value]) => fields.includes(key) && value && value !== '-' && value !== '/');

        // 检测屏幕宽度决定布局
        const screenWidth = window.innerWidth;
        const isMobile = screenWidth < 768;
        const isWideScreen = screenWidth >= 1200 && !isMobile;
        const isMediumScreen = screenWidth >= 768 && screenWidth < 1200 && !isMobile;

        // 根据屏幕宽度设置最大列数
        let maxColumnCount = 2;
        if (isMobile) {
          maxColumnCount = 1;
        } else if (isWideScreen) {
          maxColumnCount = 4;
        } else if (isMediumScreen) {
          maxColumnCount = 2;
        } else {
          maxColumnCount = 1;
        }

        // 根据实际数据量动态调整列数，优先使用最大列数
        const dataCount = validEntries.length;
        // 计算实际需要的列数，确保每列至少有一行数据
        let columnCount = Math.min(maxColumnCount, Math.ceil(dataCount / 1));

        // 只有当数据量明显少于最大列数时才减少列数
        if (dataCount < maxColumnCount) {
          columnCount = Math.max(1, dataCount);
        } else if (dataCount < maxColumnCount * 2) {
          // 如果数据量少于最大列数的2倍，且会产生超过50%的空白单元格，则减少列数
          const rowsPerMaxCol = Math.ceil(dataCount / maxColumnCount);
          const emptyCellsPercentage = (maxColumnCount * rowsPerMaxCol - dataCount) / (maxColumnCount * rowsPerMaxCol);

          if (emptyCellsPercentage > 0.5) {
            // 空白超过50%，减少列数
            columnCount = Math.ceil(dataCount / rowsPerMaxCol);
          }
        }

        // 计算实际需要的列数，确保不创建完全空的列
        // 例如，如果有10个数据项，在4列布局下，最后一列可能只有1-2个数据项
        // 但如果数据项很少（如3个），在4列布局下，最后3列可能都是空的
        // 我们需要确保每列至少有一行数据
        const minColumnCount = Math.min(columnCount, Math.ceil(dataCount / Math.ceil(dataCount / columnCount)));
        columnCount = Math.max(1, minColumnCount);

        // 创建表体
        const tbody = document.createElement('tbody');

        // 计算每列需要多少行
        const rowsPerColumn = Math.ceil(validEntries.length / columnCount);

        // 创建表体 - 按列填充
        for (let row = 0; row < rowsPerColumn; row++) {
          const tr = document.createElement('tr');

          for (let col = 0; col < columnCount; col++) {
            const entryIndex = col * rowsPerColumn + row;

            if (entryIndex < validEntries.length) {
              const [key, value] = validEntries[entryIndex];

              const keyCell = document.createElement('td');
              keyCell.className = 'process-detail-key';
              keyCell.textContent = key;
              tr.appendChild(keyCell);

              const valueCell = document.createElement('td');
              valueCell.className = 'process-detail-value';
              valueCell.textContent = value;
              tr.appendChild(valueCell);
            } else {
              // 只在有数据的列范围内添加空单元格，避免创建完全空的列
              // 检查该列是否至少有一行数据
              const hasDataInColumn = col < Math.ceil(validEntries.length / rowsPerColumn);

              if (hasDataInColumn) {
                // 数据不足时填充空单元格，保持表格对齐
                const emptyKeyCell = document.createElement('td');
                emptyKeyCell.className = 'process-detail-key';
                emptyKeyCell.textContent = '';
                tr.appendChild(emptyKeyCell);

                const emptyValueCell = document.createElement('td');
                emptyValueCell.className = 'process-detail-value';
                emptyValueCell.textContent = '';
                tr.appendChild(emptyValueCell);
              }
            }
          }

          tbody.appendChild(tr);
        }

        table.appendChild(tbody);
        return table;
      }

      // 渲染工艺参数分页控件
      function renderProcessPagination() {
        try {
          const pagination = document.getElementById('processPagination');
          if (!pagination) {
            console.error('找不到工艺参数分页容器');
            return;
          }

          // 检查数据是否已加载
          if (!filteredProcessData) {
            console.error('工艺参数数据未加载');
            pagination.innerHTML = '<div style="text-align: center; padding: 10px; color: #e74c3c;">数据未加载，请稍后重试</div>';
            return;
          }

          const total = filteredProcessData.length;
          const totalPages = Math.ceil(total / ITEMS_PER_PAGE_PROCESS);

          // 清空分页控件
          pagination.innerHTML = '';

          // 如果只有一页，不显示分页控件
          if (totalPages <= 1) return;

          // 创建分页容器 - 修改为行内显示
          const paginationContainer = document.createElement('div');
          paginationContainer.className = 'process-pagination'; // 使用CSS类名
          paginationContainer.style.display = 'flex';
          paginationContainer.style.justifyContent = 'center';
          paginationContainer.style.alignItems = 'center';
          paginationContainer.style.gap = '10px';
          paginationContainer.style.marginTop = '0px';
          paginationContainer.style.flexWrap = 'nowrap'; // 不换行
          paginationContainer.style.whiteSpace = 'nowrap'; // 防止文本换行

          // 添加上一页按钮
          const prevButton = document.createElement('button');
          prevButton.textContent = '上一页';
          prevButton.disabled = currentProcessPage === 1;

          if (!prevButton.disabled) {
            prevButton.addEventListener('click', () => {
              try {
                if (currentProcessPage > 1) {
                  currentProcessPage--;
                  renderProcessResults();
                  renderProcessPagination();
                }
              } catch (error) {
                console.error('切换上一页时出错:', error);
              }
            });
          }

          paginationContainer.appendChild(prevButton);

          // 添加页码信息
          const pageInfo = document.createElement('span');
          pageInfo.textContent = `第 ${currentProcessPage} 页，共 ${totalPages} 页`;
          pageInfo.className = 'page-info'; // 使用CSS类名
          paginationContainer.appendChild(pageInfo);

          // 添加下一页按钮
          const nextButton = document.createElement('button');
          nextButton.textContent = '下一页';
          nextButton.disabled = currentProcessPage === totalPages;

          if (!nextButton.disabled) {
            nextButton.addEventListener('click', () => {
              try {
                if (currentProcessPage < totalPages) {
                  currentProcessPage++;
                  renderProcessResults();
                  renderProcessPagination();
                }
              } catch (error) {
                console.error('切换下一页时出错:', error);
              }
            });
          }

          paginationContainer.appendChild(nextButton);

          pagination.appendChild(paginationContainer);
        } catch (error) {
          console.error('渲染工艺参数分页控件时出错:', error);
          const pagination = document.getElementById('processPagination');
          if (pagination) {
            pagination.innerHTML = '<div style="text-align: center; padding: 10px; color: #e74c3c;">分页控件渲染失败，请查看控制台了解详情</div>';
          }
        }
      }
      // 外部数据加载函数
      function loadExternalData() {
        try {
          if (!window.BearingData) {
            console.log('警告：外部数据未加载，系统将无法正常工作');
            return;
          }

          console.log('成功加载外部轴承数据');

          // 更新轴承主参数数据
          if (window.BearingData.bearingData) {
            Object.keys(bearingData).forEach(key => delete bearingData[key]);
            Object.assign(bearingData, window.BearingData.bearingData);
            console.log('轴承主参数数据已更新，当前包含', Object.keys(bearingData).length, '个轴承型号');
          }

          // 更新工艺参数数据
          if (window.BearingData.bearingProcessData?.length) {
            bearingProcessData.length = 0;  // 更简洁的清空方式
            bearingProcessData.push(...window.BearingData.bearingProcessData);
            console.log('轴承工艺参数数据已更新，当前包含', bearingProcessData.length, '条记录');
          }
        } catch (error) {

        script.async = false; // 改为同步加载，确保数据加载完成后再执行后续操作
        script.onload = loadExternalData;

      // 显示振动要求统计与关联查询结果
      function showVibrationStatistics() {
        try {
          // 清除自动查询定时器，避免与振动统计冲突
          clearTimeout(processSearchTimeout);

          const modelInput = document.getElementById('processModel');
          const customerInput = document.getElementById('processCustomer');
          const salespersonInput = document.getElementById('processSalesperson');

          if (!modelInput || !customerInput || !salespersonInput) {
            console.error('找不到输入框元素');
            alert('页面元素加载不完整，请刷新页面后重试。');
            return;
          }

          // 获取所有输入值
          const model = modelInput.value.trim();
          const customer = customerInput.value.trim();
          const salesperson = salespersonInput.value.trim();

          // 如果所有输入框都为空，提示用户至少输入一个条件
          if (!model && !customer && !salesperson) {
            alert('请至少输入一个查询条件：产品型号、客户名称或销售员');
            return;
          }

          // 数据过滤 - 基于多条件联合筛选
          const matchingRecords = bearingProcessData.filter(item => {
            try {
              // 获取产品型号、客户名称和销售员信息
              const productModel = item['产品型号'] || '';
              const itemCustomer = item['客户名称'] || '';
              const itemSalesperson = item['销售员'] || '';

              // 所有非空条件都必须满足
              const modelMatched = matchModel(model, productModel);
              let matchCustomer = !customer || itemCustomer.includes(customer);
              let matchSalesperson = !salesperson || itemSalesperson.includes(salesperson);

              // 返回同时满足所有条件的结果
              return modelMatched && matchCustomer && matchSalesperson;
            } catch (error) {
              console.error('过滤数据时出错:', error);
              return false;
            }
          });

          // 生成查询条件描述字符串
          let conditionDesc = getModelConditionDesc(model);
          if (customer) {
            conditionDesc += conditionDesc ? `、客户名称包含"${customer}"` : `客户名称包含"${customer}"`;
          }
          if (salesperson) {
            conditionDesc += conditionDesc ? `、销售员包含"${salesperson}"` : `销售员包含"${salesperson}"`;
          }

          if (matchingRecords.length === 0) {
            alert(`未找到与以下条件相关的记录：${conditionDesc}`);
            return;
          }

          // 按振动要求标准分组并统计客户信息
          const vibrationMap = new Map();

          matchingRecords.forEach(record => {
            const vibrationRequirement = record['振动要求'] || '未指定';
            const customer = record['客户名称'] || '未知客户';

            if (!vibrationMap.has(vibrationRequirement)) {
              vibrationMap.set(vibrationRequirement, {
                vibrationRequirement: vibrationRequirement,
                customers: new Set()
              });
            }

            vibrationMap.get(vibrationRequirement).customers.add(customer);
          });

          // 显示统计结果
          displayVibrationStatistics(vibrationMap, conditionDesc);
        } catch (error) {
          console.error('显示振动要求统计时出错:', error);
          alert('统计过程中发生错误，请查看控制台了解详情。');
        }
      }

        passwordModal.style.left = '0';

        // 创建密码输入标签
        const passwordLabel = document.createElement('label');
        passwordLabel.textContent = '请输入密码：';
        passwordLabel.style.color = '#e4e6eb';
        passwordLabel.style.display = 'block';

        // 创建密码输入框
        const passwordInput = document.createElement('input');

        passwordInput.style.padding = '12px 15px';
        passwordInput.style.border = '1px solid rgba(0, 168, 255, 0.5)';
        passwordInput.style.borderRadius = '6px';
        passwordInput.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';

        passwordInput.style.width = '100%';
        passwordInput.style.boxSizing = 'border-box';
        passwordInput.style.outline = 'none';

        // 创建关闭按钮容器
        const closeButtonContainer = document.createElement('div');

        closeButtonContainer.style.top = '10px';
        closeButtonContainer.style.right = '10px';

        // 创建关闭按钮
        const closeButton = document.createElement('button');

        closeButton.style.width = '30px';

        closeButton.style.backgroundColor = 'transparent';

        closeButton.style.fontSize = '1.5rem';
        closeButton.style.lineHeight = '1';
        closeButton.style.display = 'flex';

        // 鼠标悬停效果
        closeButton.onmouseover = function () {

        closeButton.onmouseout = function () {
          this.style.backgroundColor = 'transparent';

        // 组装弹窗内容
        modalContent.style.position = 'relative'; // 为关闭按钮定位做准备
        modalContent.appendChild(closeButtonContainer);
        closeButtonContainer.appendChild(closeButton);
        modalContent.appendChild(passwordLabel);
        modalContent.appendChild(passwordInput);
        passwordModal.appendChild(modalContent);

        // 添加到文档中
        document.body.appendChild(passwordModal);

        // 自动聚焦到密码输入框
        passwordInput.focus();

        // 验证密码函数
        function validatePassword() {
          const password = passwordInput.value;
          if (password === '321') {
            // 密码正确，设置验证状态
            sessionStorage.setItem('priceParamsVerified', 'true');
            window.isPricePasswordVerified = true;

            // 关闭弹窗
            passwordModal.style.display = 'none';

            // 重新调用统计函数
            showTaxIncludedPriceStatistics();
          } else if (password.length >= 3) { // 只在输入了至少3个字符时验证（避免空输入）
            // 密码错误，显示错误提示
            passwordInput.style.borderColor = '#ff6b6b';
            passwordInput.value = '';
            passwordInput.placeholder = '密码错误，请重试';



            setTimeout(() => {
              passwordInput.style.borderColor = 'rgba(0, 168, 255, 0.5)';
              passwordInput.placeholder = '请输入密码';
            }, 2000);

            passwordInput.focus();
          }
        }

        // 输入框输入时自动验证
        passwordInput.addEventListener('input', validatePassword);

        // 支持回车确认
        passwordInput.addEventListener('keypress', function (event) {
          if (event.key === 'Enter' && passwordInput.value.length >= 3) {
            validatePassword();
          }
        });

        // 关闭按钮
        closeButton.addEventListener('click', function () {
