    <script>
      // 轴承工艺查询 - 主要功能代码

      // 全局变量，跟踪当前查询的轴承型号
      let currentModel = '';

      // 全局变量，跟踪用户是否手动修改了钢球系数
      let isKwManuallyModified = false;

      // 全局变量，跟踪用户是否手动修改了中心径
      let isCenterDiameterManuallyModified = false;

      // 全局变量，跟踪用户是否手动修改了外挡系数
      let isKdManuallyModified = false;

      // 全局变量，跟踪用户是否手动修改了内挡系数
      let isKdInnerManuallyModified = false;

      // 全局变量，标记当前型号是否从变体选择列表中选定
      // 为true时，切换参数不再弹出变体列表，直接刷新当前型号
      let _modelSelectedFromList = false;

      // 自动查询函数

      function autoQuery() {
        if (currentModel && Object.keys(bearingData).length > 0) {
          queryBearing();
        }
      }

      // 响应式选项布局模块
      const StrictlyResponsiveRadioGroup = {
        // 初始化所有选项组的响应式布局
        init: function () {
          const radioGroups = document.querySelectorAll('.radio-group');
          radioGroups.forEach(group => {
            this.applyStrictLayout(group);
          });
        },

        // 应用响应式布局到选项组
        applyStrictLayout: function (group) {
          // 获取容器宽度，宽度不足时直接返回
          const containerWidth = group.offsetWidth;
          if (!containerWidth || containerWidth < 100) return;

          // 获取所有选项，无选项时直接返回
          const items = group.querySelectorAll('.radio-item');
          if (items.length === 0) return;

          // 设置基本参数
          const isMobile = window.innerWidth <= 768;
          const minItemWidth = isMobile ? 45 : 100; // 移动端和桌面端的最小宽度
          const gap = 8; // 选项间距

          // 清除所有选项的现有样式
          items.forEach(item => {
            item.style.flex = '';
            item.style.minWidth = '';
            item.style.maxWidth = '';
          });

          // 逐行处理选项
          for (let i = 0; i < items.length;) {
            // 计算当前行最多可放置的选项数量
            const maxPossibleItems = Math.floor((containerWidth + gap) / (minItemWidth + gap));
            // 确定当前行实际放置的选项数量
            const itemsInRow = Math.min(maxPossibleItems, items.length - i);

            // 计算每个选项的宽度
            const totalGapWidth = (itemsInRow - 1) * gap;
            const availableWidth = containerWidth - totalGapWidth;
            const itemWidth = Math.floor(availableWidth / itemsInRow);

            // 应用样式到当前行的选项
            for (let j = 0; j < itemsInRow && i + j < items.length; j++) {
              const item = items[i + j];

              if (isMobile) {
                // 移动端：使用固定宽度
                item.style.flex = '0 0 auto';
                item.style.width = `${minItemWidth}px`;
              } else {
                // 桌面端：等比例拉伸
                item.style.flex = `1 1 ${itemWidth}px`;
              }
              item.style.minWidth = `${minItemWidth}px`;
            }

            // 移动到下一行
            i += itemsInRow;
          }
        }
      };

      /**
       * 页面加载完成后的初始化设置
       * 这个函数在HTML页面完全加载后执行，负责设置各种默认值和事件监听器
       * 
       * 主要功能：
       * 1. 设置挡边系数和钢球系数的默认值
       * 2. 添加窗口大小变化监听，实现响应式布局
       * 3. 为型号输入框添加键盘事件监听（回车查询和自动查询）
       * 4. 为所有单选按钮添加切换监听，实现参数切换时的自动查询
       */
      document.addEventListener('DOMContentLoaded', function () {

        // 设置挡边系数和钢球系数的默认值
        // 这些系数用于计算轴承的更多技术参数
        // 只有当元素存在时才设置默认值
        const kdElement = document.getElementById('kd');
        const kdInnerElement = document.getElementById('kd_inner');
        const kwElement = document.getElementById('kw');
        // 新增的输入框默认值设置
        const bmElement = document.getElementById('bm');
        const iElement = document.getElementById('i');
        const alphaElement = document.getElementById('alpha');

        if (kdElement) kdElement.value = '0.36';      // 外圈挡边系数默认值
        if (kdInnerElement) kdInnerElement.value = '0.38'; // 内圈挡边系数默认值
        if (kwElement) kwElement.value = '0.28';      // 钢球系数默认值
        // 设置新增输入框的默认值
        if (bmElement) bmElement.value = '1.3';       // 材料系数默认值
        if (iElement) iElement.value = '1';           // 滚珠列数默认值
        if (alphaElement) alphaElement.value = '0';   // 角接触角默认值

        // 为钢球系数输入框添加事件监听器，跟踪用户是否手动修改
        // 使用事件对象的isTrusted属性来区分用户输入和程序设置
        if (kwElement) {
          kwElement.addEventListener('input', function (e) {
            // isTrusted为true表示是用户真实的输入操作，false表示是程序触发的
            if (e.isTrusted) {
              isKwManuallyModified = true;
            }
          });
        }

        // 为钢球系数输入框添加change事件监听器，用于触发重新计算
        if (kwElement) {
          kwElement.addEventListener('change', function (e) {
            if (e.isTrusted && currentModel) {
              // 用户手动修改后，重新计算更多参数
              const bearing = bearingData[currentModel];
              if (bearing) {
                calculateAndDisplayMoreParams(currentModel, bearing);
              }
            }
          });
        }

        // 为外挡系数输入框添加事件监听器，跟踪用户是否手动修改
        if (kdElement) {
          kdElement.addEventListener('input', function (e) {
            if (e.isTrusted) {
              isKdManuallyModified = true;
            }
          });
        }

        // 为外挡系数输入框添加change事件监听器，用于触发重新计算
        if (kdElement) {
          kdElement.addEventListener('change', function (e) {
            if (e.isTrusted && currentModel) {
              const bearing = bearingData[currentModel];
              if (bearing) {
                calculateAndDisplayMoreParams(currentModel, bearing);

        // 为内挡系数输入框添加事件监听器，跟踪用户是否手动修改
        if (kdInnerElement) {

        if (kdInnerElement) {

        /**

        window.addEventListener('resize', function () {

          /**

          input.addEventListener('input', function () {

            clearTimeout(dimensionSearchTimeout);

            // 设置新的定时器，延迟500ms执行查询
            dimensionSearchTimeout = setTimeout(function () {

              const hasValue = dimensionInputs.some(inp => inp.value.trim());

              }

          });
        });

        /**
         * 单选按钮标签的点击事件处理
         * 为所有单选按钮标签（如公差等级、游隙组别、振动等级等）添加点击事件

          label.addEventListener('click', function (e) {

            // 否则，让浏览器默认行为处理（选中）

            /**

      /**
       * ========== 轴承工艺参数数据 ==========
       * 仅使用外部数据，初始化为空数组
       */
      const bearingProcessData = []
      const bearingData = {}

      // 轴承系列相关函数和公差数据处理函数已迁移到 bearing parameter query.js 文件中

      // ========== 工具函数区域 ==========
      // 轴承系列相关函数已迁移到 bearing parameter query.js 文件中

      // 复制内容到剪贴板
      // 复制功能相关函数已迁移到 bearing parameter query.js 文件中

      // ========== 尺寸查询功能 ==========

      // 验证尺寸输入
      function validateDimensionInputs(d, D, B) {
        if (Object.keys(bearingData).length === 0) {
          alert('轴承数据尚未加载，请等待...');
          return false;
        }

        if (isNaN(d) && isNaN(D) && isNaN(B)) {

        }

        if (!isNaN(d) && !isNaN(D) && d >= D) {
          alert("内径必须小于外径！");
          return false;
        }

        return true;
      }

      // 按外形尺寸查询轴承型号
      function queryByDimensions() {
        const d = parseFloat(document.getElementById('dimension-d').value);
        const D = parseFloat(document.getElementById('dimension-D').value);
        const B = parseFloat(document.getElementById('dimension-B').value);

        if (!validateDimensionInputs(d, D, B)) return;

        displayDimensionResults(findBearingsByDimensions(d, D, B), d, D, B);
      }

      // 根据外形尺寸查找轴承型号
      function findBearingsByDimensions(d, D, B) {
        // 特殊处理：如果输入69，直接匹配619系列
        let targetModels = null;
        if (d === 69) {
          targetModels = ['619'];
        } else if (d === 68) {
          targetModels = ['618'];
        } else if (d === 160) {
          targetModels = ['160'];
        } else if (d === 600) {
          targetModels = ['60'];
        }

        // 首先获取国标界面的输入值，用于处理非标轴承
        const dimensionD = parseFloat(document.getElementById('dimension-d').value) || 0;
        const dimensionDOuter = parseFloat(document.getElementById('dimension-D').value) || 0;
        const dimensionB = parseFloat(document.getElementById('dimension-B').value) || 0;

        return Object.entries(bearingData)
          .filter(([model, bearing]) => {
            // 特殊处理：非标轴承
            if (model === "非标轴承") {
              // 只有当用户在国标界面输入了尺寸时，才显示非标轴承
              return dimensionD > 0 && dimensionDOuter > 0 && dimensionB > 0;
            }

            const { d: bd, D: bD, B: bB } = bearing;

            // 如果指定了目标系列，只检查型号前缀，跳过尺寸匹配
            if (targetModels) {
              return targetModels.some(prefix => model.startsWith(prefix));
            }

            // 普通输入才做尺寸匹配
            return bd && bD && bB && calculateDimensionMatch(d, D, B, bd, bD, bB) > 0;
          })
          .map(([model, bearing]) => {
            // 特殊处理：非标轴承
            if (model === "非标轴承") {
              // 执行型号查询，获取第一个高度匹配的轴承型号的倒角值
              let rmin = 0;
              let Trmax = 0;
              let Tamax = 0;

              if (dimensionD > 0 && dimensionDOuter > 0 && dimensionB > 0) {
                // 直接过滤标准轴承，避免递归调用
                const standardBearings = Object.entries(bearingData)
                  .filter(([model, bearing]) => {
                    // 排除非标轴承
                    if (model === "非标轴承") return false;

                    const { d: bd, D: bD, B: bB } = bearing;
                    // 只检查标准轴承的尺寸匹配
                    return bd && bD && bB && calculateDimensionMatch(dimensionD, dimensionDOuter, dimensionB, bd, bD, bB) > 0;
                  })
                  .map(([model, bearing]) => {
                    // 计算匹配分数
                    const matchScore = calculateDimensionMatch(dimensionD, dimensionDOuter, dimensionB, bearing.d, bearing.D, bearing.B);
                    return {
                      model,
                      bearing,
                      matchScore,
                      matchLevel: getMatchLevel(matchScore)
                    };
                  })
                  .sort((a, b) => b.matchScore - a.matchScore);

                if (standardBearings.length > 0) { // 至少有一个标准轴承匹配
                  // 获取第一个标准轴承的倒角值
                  const firstStandardBearing = standardBearings[0];
                  if (firstStandardBearing) {
                    rmin = firstStandardBearing.bearing.rmin || 0;
                    Trmax = firstStandardBearing.bearing.Trmax || 0;
                    Tamax = firstStandardBearing.bearing.Tamax || 0;
                  }
                }
              }

              // 为非标轴承设置最高匹配分数，确保它显示在结果顶部
              return {
                model,
                bearing: {
                  d: dimensionD,
                  D: dimensionDOuter,
                  B: dimensionB,
                  ballSize: "",
                  ballCount: "",
                  centerDiameter: "",
                  rmin: rmin,
                  Trmax: Trmax,
                  Tamax: Tamax
                },
                matchScore: 100, // 最高分数
                matchLevel: getMatchLevel(100)
              };
            }

            // 系列输入直接给满分，普通输入计算匹配度
            const matchScore = targetModels ? 100 : calculateDimensionMatch(d, D, B, bearing.d, bearing.D, bearing.B);
            return {
              model,
              bearing,
              matchScore,
              matchLevel: getMatchLevel(matchScore)
            };
          })
          .sort((a, b) => b.matchScore - a.matchScore)
          .slice(0, 15);
      }

      // 显示尺寸查询结果
      function displayDimensionResults(matches, d, D, B) {
        const resultDiv = document.getElementById('result');

        // 构建显示文本
        const dimensionText = ['d', 'D', 'B']
          .map((name, i) => {
            const value = [d, D, B][i];
            const label = { d: '内径', D: '外径', B: '宽度' }[name];
            return isNaN(value) ? null : `${label}: ${value}mm`;
          })
          .filter(Boolean)
          .join(' × ');

        if (matches.length === 0) {
          resultDiv.innerHTML = `<p style="color: #e74c3c;">未找到与尺寸 ${dimensionText} 匹配的轴承型号！</p>`;
          resultDiv.style.display = 'block';
          return;
        }

        const matchConfig = {
          perfect: { text: '精确匹配', class: 'match-perfect' },
          good: { text: '高度匹配', class: 'match-good' },
          fair: { text: '近似匹配', class: 'match-fair' }
        };

        const resultItems = matches.map(({ model, bearing, matchLevel }) => {
          const { d: bd, D: bD, B: bB } = bearing;
          const config = matchConfig[matchLevel];
          return `
            <div class="dimension-result-item" onclick="selectDimensionResult('${model}')">
              <div class="dimension-info" style="flex: 1; text-align: left;">
                <strong>${model}</strong>：${bd}×${bD}×${bB} mm
              </div>
              <div class="match-label" style="text-align: right; white-space: nowrap;">
                <span class="dimension-match-level ${config.class}">${config.text}</span>
              </div>
            </div>
          `;
        }).join('');

        resultDiv.innerHTML = `
          <h3 style="color: var(--primary-blue); margin-bottom: 15px; text-align: center;">尺寸查询结果 (${dimensionText})</h3>
          <p>找到 ${matches.length} 个匹配的轴承型号：</p>
          <div class="dimension-results-container">
            ${resultItems}
          </div>
          <p style="margin-top: 15px; font-size: 14px; color: rgba(255,255,255,0.7);">
            点击型号可查看详细参数
          </p>
        `;
        resultDiv.style.display = "block";
      }

      /**
       * 选择尺寸查询结果中的型号
       * @param {string} model - 选中的轴承型号

      function selectDimensionResult(model) {
        // 填充型号输入框
        document.getElementById('model').value = model;

      // ========== 主查询功能 ==========

      // 渲染查询结果
      function renderResult(model, bearing, tolerance, clearance, vibAcc, vibVel) {
        const { d, D, B, ballSize, ballCount, centerDiameter, rmin, Trmax, Tamax, D2, d2 } = bearing;

        // 根据是否有钢球尺寸的查表值来计算钢球系数的默认值
        // 重置手动修改标志（每次查询新轴承时重置）
        isKwManuallyModified = false;
        isCenterDiameterManuallyModified = false;
        isKdManuallyModified = false;
        isKdInnerManuallyModified = false;

        // 计算钢球系数的默认值
        let kwDefaultValue = '0.28';
        if (ballSize && D && d) {
          // 有查表值，计算钢球系数 = 钢球尺寸 / (外径 - 内径)
          const calculatedKw = ballSize / (D - d);
          kwDefaultValue = calculatedKw.toFixed(2);
        }

        // 计算挡边系数默认值（有查表值时根据实际挡边直径反算）
        // KD = 1 - (D2 - Dwp) / Dw, Kd = 1 - (Dwp - d2) / Dw
        let kdDefaultValue = '0.36';
        let kdInnerDefaultValue = '0.38';
        if (ballSize && centerDiameter) {
          const bs = parseFloat(ballSize);
          const cd = parseFloat(centerDiameter);
          if (bs > 0 && cd > 0) {
            // 外圈：有D2查表值时反算KD
            if (D2 && parseFloat(D2) > 0) {
              const d2Val = parseFloat(D2);
              const calcKd = 1 - (d2Val - cd) / bs;
              if (calcKd >= 0.15 && calcKd <= 0.5) {
                kdDefaultValue = calcKd.toFixed(3);
              }
            }
            // 内圈：有d2查表值时反算Kd
            if (d2 && parseFloat(d2) > 0) {
              const d2InnerVal = parseFloat(d2);
              const calcKdInner = 1 - (cd - d2InnerVal) / bs;
              if (calcKdInner >= 0.15 && calcKdInner <= 0.5) {
                kdInnerDefaultValue = calcKdInner.toFixed(3);
              }
            }
          }
        }

        // 计算中心径的默认值
        let centerDiameterDefaultValue = centerDiameter || ((D + d) / 2).toFixed(3);

        // 计算板宽系数的默认值
        const baseSeries = model === "非标轴承" ? "2" : getDiameterSeries(model);
        let kcDefaultValue = baseSeries === "0" ? "0.48" : "0.45";

        // 获取材质参数值
        const materials = Array.from(document.querySelectorAll('input[name="material"]:checked')).map(input => input.value).join('、');
        const materialFactories = Array.from(document.querySelectorAll('input[name="materialFactory"]:checked')).map(input => input.value).join('、');
        const tubeFactories = Array.from(document.querySelectorAll('input[name="tubeFactory"]:checked')).map(input => input.value).join('、');
        const tubeProcesses = Array.from(document.querySelectorAll('input[name="tubeProcess"]:checked')).map(input => input.value).join('、');

        const rows = [
          ['🔍 产品型号', model],
          ['📐 外形d×D×B', ` ${d}×${D}×${B}  mm`]
        ];

        // 添加结构参数
        if (ballSize) {
          rows.push(['🎱 钢球尺寸 Dw', `${ballSize} mm`]);
        }

        if (ballCount) {
          rows.push(['🔢 钢球数量 Z', `${ballCount} 个`]);
        }

        // 只有当有查表值且用户没有手动修改中心径时，才在基本参数中显示中心径
        if (centerDiameter && !isCenterDiameterManuallyModified) {
          rows.push(['⭕ 中心径Dwp', `${parseFloat(centerDiameter).toFixed(3)} mm`]);
        }

        // 添加挡边直径信息（优先使用查表值）
        if (D2) rows.push(['📐 外圈挡边D2', `${parseFloat(D2).toFixed(2)} mm`]);
        if (d2) rows.push(['📐 内圈挡边d2', `${parseFloat(d2).toFixed(2)} mm`]);

        if (rmin && Trmax) rows.push(['📐 径向倒角Tr', `${rmin}～${Trmax} mm`]);
        if (rmin && Tamax) rows.push(['📐 轴向倒角Ta', `${rmin}～${Tamax} mm`]);


        // 添加公差信息
        if (tolerance) {
          // 查找完整的内圈公差数据和外圈公差数据
          const innerTolData = findInRanges(d, window.BearingData.innerTol[tolerance], "");
          const outerTolData = findInRanges(D, window.BearingData.outerTol[tolerance], "");

          // 显示外径基本公差
          if (outerTolData && outerTolData.t) {
            rows.push([`📏 外径公差 ${tolerance}`, `【Φ${D}】 ${outerTolData.t.U} / ${outerTolData.t.L} μm`]);

            // 根据轴承型号确定直径系列
            let series = getBearingSeries(model);

            // 使用切换按钮的状态来判断轴承是开式还是闭式
            const bearingTypeToggle = document.getElementById('bearing-type-toggle');
            // 确保正确判断轴承类型
            const isClosedBearing = bearingTypeToggle && bearingTypeToggle.textContent.trim() === '闭式';

            // 已经在全局定义了getBearingSeries函数，直接使用即可

            // 调试信息（可选）
            console.log('轴承类型:', isClosedBearing ? '闭式' : '开式');
            console.log('直径系列:', series);
            console.log('椭圆度数据:', outerTolData.oval);

            // 添加外圈几何公差信息并整合到一行
            // 明确区分开式和闭式轴承的椭圆度值
            let outerOvalValue = '';
            if (outerTolData.oval) {
              // 转换系列号为对应的组合系列格式
              let combinedSeries = '';
              if (['8', '9'].includes(series)) {
                combinedSeries = '8/9';
              } else if (['0', '1'].includes(series)) {
                combinedSeries = '01';
              } else if (['2', '3', '4'].includes(series)) {
                combinedSeries = '234';
              } else {
                combinedSeries = series; // 保持原有值，以防特殊情况
              }

              if (isClosedBearing && outerTolData.oval.closed !== undefined) {
                // 闭式轴承根据组合系列获取对应的椭圆度公差
                // closed是一个对象，包含了8/9、01、234系列的值
                const closedOvalValue = typeof outerTolData.oval.closed === 'object' ?
                  outerTolData.oval.closed[combinedSeries] : outerTolData.oval.closed;
                if (closedOvalValue !== undefined) {
                  outerOvalValue = `≤${closedOvalValue}`;
                }
              } else if (!isClosedBearing && outerTolData.oval[combinedSeries] !== undefined) {
                // 开式轴承使用组合系列对应值
                outerOvalValue = `≤${outerTolData.oval[combinedSeries]}`;
              }
            }
            const outerTaperValue = outerTolData.taper !== undefined ? `≤${outerTolData.taper}` : '';
            const outerRunoutValue = outerTolData.runout !== undefined ? `≤${outerTolData.runout}` : '';

            // 整合外圈几何公差参数为一行，格式为"外径圆度丨锥度丨跳动 P0：≤10 丨≤8丨≤13 μm"
            if (outerOvalValue || outerTaperValue || outerRunoutValue) {
              const outerValues = [outerOvalValue, outerTaperValue, outerRunoutValue].filter(v => v !== '');
              if (outerValues.length > 0) {
                rows.push([`外径圆度丨锥度丨跳动 ${tolerance}`, `${outerValues.join(' 丨')} μm`]);
              }
            }
          }
          if (innerTolData) {
            // 显示基本公差
            rows.push([`📏 内径公差 ${tolerance}`, `【Φ${d}】 ${innerTolData.t.U} / ${innerTolData.t.L} μm`]);

            // 根据轴承型号确定直径系列
            let series = getBearingSeries(model);

            // 添加几何公差信息
            // 转换系列号为对应的组合系列格式
            let combinedSeries = '';
            if (['8', '9'].includes(series)) {
              combinedSeries = '8/9';
            } else if (['0', '1'].includes(series)) {
              combinedSeries = '01';
            } else if (['2', '3', '4'].includes(series)) {
              combinedSeries = '234';
            } else {
              combinedSeries = series; // 保持原有值，以防特殊情况
            }
            // 收集内径椭圆、内径锥度、内圈跳动三个参数的值
            const ovalValue = innerTolData.oval && innerTolData.oval[combinedSeries] ? `≤${innerTolData.oval[combinedSeries]}` : '';
            const taperValue = innerTolData.taper !== undefined ? `≤${innerTolData.taper}` : '';
            const runoutValue = innerTolData.runout !== undefined ? `≤${innerTolData.runout}` : '';

            // 整合这三个参数为一行，格式为"内径圆度丨锥度丨跳动 P0：≤10 丨≤8丨≤13 μm"
            // 只有当至少有一个值存在时才添加这一行
            if (ovalValue || taperValue || runoutValue) {
              // 使用数组存储值，以便过滤掉空值并保持顺序
              const values = [ovalValue, taperValue, runoutValue].filter(v => v !== '');
              // 如果有值，则格式化为指定的字符串
              if (values.length > 0) {
                rows.push([`内径圆度丨锥度丨跳动 ${tolerance}`, `${values.join(' 丨')} μm`]);
              }
            }

            // 端高公差移到内径圆度丨锥度丨跳动跳之后
            rows.push([`📏 端高公差 ${tolerance}`, `【${B}】 ${innerTolData.t.BsU} / ${innerTolData.t.BsL} μm`]);

            // 平行差保持独立显示
            if (innerTolData.parallelism !== undefined) {
              rows.push([`📏 平行差 ${tolerance}`, `≤${innerTolData.parallelism} μm`]);
            }
          }
        }

        // 添加游隙信息
        if (clearance) {
          const cr = findInRanges(d, window.BearingData.clearanceRanges, clearance);
          if (cr) rows.push([`⚙️ 游隙组别 ${clearance}`, `${cr} μm`]);
        }

        // 添加振动加速度信息
        if (vibAcc) {
          // 特殊处理：非标轴承指定为2系列
          const series = model === "非标轴承" ? "2" : getDiameterSeries(model);
          const accVal = findInRanges(D, window.BearingData.vibAccData, "series")?.[series]?.[vibAcc];
          if (accVal !== undefined) rows.push([`🔊 噪音等级 ${vibAcc}`, `≤${accVal} dB`]);
        }

        // 添加振动速度信息
        if (vibVel) {
          const velObj = findInRanges(D, window.BearingData.vibVelData, vibVel);
          if (velObj) {
            rows.push([`📈 振动速度 ${vibVel}`, `${velObj.low}/${velObj.mid}/${velObj.high} μm/s`]);
          }
        }

        // 添加材质参数信息
        if (materialFactories) {
          const materialLabel = materials ? `🏭 套圈材料 ${materials}` : '🏭 套圈材料';
          rows.push([materialLabel, materialFactories]);

        if (tubeProcesses) {

          rows.push([tubeProcessLabel, tubeProcesses]);

        // 构建结果HTML

                    <input type="number" id="kd_inner" value="${kdInnerDefaultValue}" step="0.01" min="0.15" max="0.5" class="more-params-input" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid rgba(0, 168, 255, 0.5); color: var(--text-light); font-size: 14px; transition: all .3s ease; height: 30px; box-sizing: border-box;" />
                  </div>
                  <div style="flex: 1; min-width: 100px;">
                    <div class="label-with-icon">
                      <span class="label" style="font-size: 14px;">钢球系数Kw：</span>

                    <input type="number" id="kw" value="${kwDefaultValue}" step="0.01" min="0.2" max="0.35" class="more-params-input" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid rgba(0, 168, 255, 0.5); color: var(--text-light); font-size: 14px; transition: all .3s ease; height: 30px; box-sizing: border-box;" />

        const resultDiv = document.getElementById("result");

      /**
       * 为更多参数输入框设置事件监听器
       * @param {string} model - 轴承型号
       * @param {Object} bearing - 轴承数据
       */
      function setupMoreParamsInputListeners(model, bearing) {
        const kdInput = document.getElementById('kd');
        const kdInnerInput = document.getElementById('kd_inner');
        const kwInput = document.getElementById('kw');
        // 新增的输入框
        const bmInput = document.getElementById('bm');
        const iInput = document.getElementById('i');
        const alphaInput = document.getElementById('alpha');
        const centerDiameterInput = document.getElementById('centerDiameter');
        const kcInput = document.getElementById('kc');

        // 为每个输入框添加事件监听器
        if (kdInput) {
          kdInput.addEventListener('input', function (e) {
            if (e.isTrusted) {
              isKdManuallyModified = true;
            }
            debounceCalculateMoreParams(model, bearing);
          });

          kdInput.addEventListener('change', function (e) {
            if (e.isTrusted) {
              calculateAndDisplayMoreParams(model, bearing);
            }
          });
        }

        if (kdInnerInput) {
          kdInnerInput.addEventListener('input', function (e) {
            if (e.isTrusted) {
              isKdInnerManuallyModified = true;
            }
            debounceCalculateMoreParams(model, bearing);
          });

          kdInnerInput.addEventListener('change', function (e) {
            if (e.isTrusted) {
              calculateAndDisplayMoreParams(model, bearing);
            }
          });
        }

        // 钢球系数的事件监听
        // 在这里添加input事件用于设置isKwManuallyModified标志
        // 添加change事件用于触发重新计算
        if (kwInput) {
          kwInput.addEventListener('input', function (e) {
            console.log('钢球系数input事件触发, isTrusted:', e.isTrusted);
            if (e.isTrusted) {
              isKwManuallyModified = true;
              console.log('isKwManuallyModified 设置为 true');
            }
          });

          kwInput.addEventListener('change', function (e) {
            console.log('钢球系数change事件触发, isTrusted:', e.isTrusted, 'model:', model);
            if (e.isTrusted) {
              // 用户手动修改后，重新计算更多参数
              console.log('触发重新计算更多参数');
              calculateAndDisplayMoreParams(model, bearing);
            }
          });
        }

        // 为新增的输入框添加事件监听器
        if (bmInput) {
          bmInput.addEventListener('input', function () {
            debounceCalculateMoreParams(model, bearing);
          });
        }

        if (iInput) {
          iInput.addEventListener('input', function () {
            debounceCalculateMoreParams(model, bearing);
          });
        }

        if (alphaInput) {
          alphaInput.addEventListener('input', function () {
            debounceCalculateMoreParams(model, bearing);
          });
        }

        // 为中心径输入框添加事件监听器
        if (centerDiameterInput) {
          centerDiameterInput.addEventListener('input', function (e) {
            if (e.isTrusted) {
              isCenterDiameterManuallyModified = true;
            }
          });

          centerDiameterInput.addEventListener('change', function (e) {
            if (e.isTrusted) {
              // 用户手动修改后，重新计算更多参数
              calculateAndDisplayMoreParams(model, bearing);
            }
          });
        }

        // 为板宽系数输入框添加事件监听器
        if (kcInput) {
          kcInput.addEventListener('input', function () {
            debounceCalculateMoreParams(model, bearing);
          });
        }

        // 为板厚S选择框添加事件监听器
        const cageThicknessSelect = document.getElementById('cageThickness');
        if (cageThicknessSelect) {
          cageThicknessSelect.addEventListener('change', function () {
            calculateAndDisplayMoreParams(model, bearing);
          });
        }
      }

      // 防抖函数，避免频繁计算
      let moreParamsCalculateTimeout;
      function debounceCalculateMoreParams(model, bearing) {
        clearTimeout(moreParamsCalculateTimeout);
        moreParamsCalculateTimeout = setTimeout(function () {
          calculateAndDisplayMoreParams(model, bearing);
        }, 300); // 300ms防抖延迟
      }

      /**
       * 计算并显示更多参数结果
       * @param {string} model - 轴承型号
       * @param {Object} bearing - 轴承数据
       */
      function calculateAndDisplayMoreParams(model, bearing) {
        // 获取更多参数结果区域
        const moreParamsResults = document.getElementById('moreParamsResults');
        if (!moreParamsResults) return;

        // 如果用户手动修改了中心径，隐藏基本参数区域中的查表值
        if (isCenterDiameterManuallyModified) {

          if (resultTable) {
            const rows = resultTable.querySelectorAll('tr');
            rows.forEach(row => {
              const labelCell = row.querySelector('.param-label');
              if (labelCell && labelCell.textContent.includes('中心径Dwp')) {
                row.style.display = 'none';
              }
            });
          }
        } else {
          // 如果用户没有手动修改中心径，显示基本参数区域中的查表值
          const resultTable = document.querySelector('#result table.result-table tbody');

            const rows = resultTable.querySelectorAll('tr');
            rows.forEach(row => {
              const labelCell = row.querySelector('.param-label');
              if (labelCell && labelCell.textContent.includes('中心径Dwp')) {

        // 如果用户手动修改了钢球系数，隐藏基本参数区域中的钢球尺寸查表值
        if (isKwManuallyModified) {
          const resultTable = document.querySelector('#result table.result-table tbody');
          if (resultTable) {
            const rows = resultTable.querySelectorAll('tr');
            rows.forEach(row => {
              const labelCell = row.querySelector('.param-label');
              if (labelCell && labelCell.textContent.includes('钢球尺寸 Dw')) {
                row.style.display = 'none';
              }
            });
          }
        } else {
          // 如果用户没有手动修改钢球系数，显示基本参数区域中的钢球尺寸查表值
          const resultTable = document.querySelector('#result table.result-table tbody');
          if (resultTable) {
            const rows = resultTable.querySelectorAll('tr');
            rows.forEach(row => {
              const labelCell = row.querySelector('.param-label');
              if (labelCell && labelCell.textContent.includes('钢球尺寸 Dw')) {
                row.style.display = '';
              }
            });
          }
        }

        // 如果用户手动修改了外挡系数，隐藏基本参数区域中的外圈挡边查表值
        if (isKdManuallyModified) {
          const resultTable = document.querySelector('#result table.result-table tbody');
          if (resultTable) {

          const resultTable = document.querySelector('#result table.result-table tbody');
          if (resultTable) {
            const rows = resultTable.querySelectorAll('tr');
            rows.forEach(row => {
              const labelCell = row.querySelector('.param-label');
              if (labelCell && labelCell.textContent.includes('外圈挡边D2')) {
                row.style.display = '';
              }
            });
          }
        }

        // 如果用户手动修改了内挡系数，隐藏基本参数区域中的内圈挡边查表值
        if (isKdInnerManuallyModified) {
          const resultTable = document.querySelector('#result table.result-table tbody');
          if (resultTable) {
            const rows = resultTable.querySelectorAll('tr');
            rows.forEach(row => {
              const labelCell = row.querySelector('.param-label');
              if (labelCell && labelCell.textContent.includes('内圈挡边d2')) {
                row.style.display = 'none';
              }
            });
          }
        } else {
          // 如果用户没有手动修改内挡系数，显示基本参数区域中的内圈挡边查表值
          const resultTable = document.querySelector('#result table.result-table tbody');
          if (resultTable) {
            const rows = resultTable.querySelectorAll('tr');
            rows.forEach(row => {
              const labelCell = row.querySelector('.param-label');
              if (labelCell && labelCell.textContent.includes('内圈挡边d2')) {
                row.style.display = '';
              }
            });
          }
        }

        // 计算更多参数
        const moreParams = calculateMoreParams(model, bearing);

        if (moreParams.length > 0) {
          // 构建结果HTML，使用与基本参数输出结果区域相同的样式
          let resultsHtml = `<div class="result-content">
                            <table class="result-table">
                              <tbody>`;

          // 删除标题行，只显示参数数据

          moreParams.forEach(([label, value]) => {
            resultsHtml += `<tr class="result-row">

                            <td class="param-value">${value}</td>

          resultsHtml += `</tbody>
                      </table>
                    </div>`;
          moreParamsResults.innerHTML = resultsHtml;
          moreParamsResults.style.display = 'block';

          // 为更多参数区域的行添加点击事件

      // ============================================================ 
      // 切换轴承类型函数
      // 用途：控制轴承类型在开式和闭式之间切换
      // 功能：
      // 切换开式/闭式状态：更新文本、样式类、重新查询
      // ============================================================ 
      function toggleBearingType() {
        // 获取切换按钮的DOM引用
        const button = document.getElementById('bearing-type-toggle');
        if (button) {
          // 根据当前按钮文本状态切换到相反的类型
          if (button.textContent.trim() === '开式') {
            // 从开式切换到闭式
            button.textContent = '闭式';
            button.classList.add('closed-type'); // 添加闭式样式
          } else {
            // 从闭式切换到开式
            button.textContent = '开式';
            button.classList.remove('closed-type'); // 移除闭式样式
          }

          // 切换类型后自动重新查询，确保椭圆度等参数正确更新
          // 注意：只有当当前有查询结果时才重新查询，避免无意义的请求
          if (currentModel) {
            queryBearing();
          }
        }
      }

      // ============================================================ 
      // 主查询函数 - 根据型号查询轴承参数
      // 用途：整个应用的核心功能函数，处理轴承型号查询逻辑
      // 功能流程：
      // 查询流程：验证输入、收集参数、匹配型号、显示结果/推荐
      /**
             * 轴承型号主查询函数
             * 用途：整个应用的核心功能函数，处理轴承型号查询逻辑，是用户与系统交互的主要接口
             * 参数：无（直接从DOM获取用户输入）
             * 返回值：无（直接更新页面显示）
             * 功能流程：
             * 1. 获取并验证用户输入的轴承型号
             * 2. 收集用户选择的辅助参数（游隙、振动等级、公差等）
             * 3. 生成候选型号并尝试精确匹配
             * 4. 如找到匹配，渲染并显示详细结果
             * 5. 如未找到，使用多维度相似度算法推荐相似型号
             * 注意事项：
             * - 支持多种型号格式变体
             * - 包含输入验证和错误处理
             * - 更新全局变量currentModel记录当前查询状态
             */
      function queryBearing() {
        // 检查数据是否已加载
        if (Object.keys(bearingData).length === 0) {
          alert('轴承数据尚未加载，请等待...');
          return;
        }

        // 步骤1: 获取用户输入的轴承型号并去除前后空格
        const modelInput = document.getElementById("model").value.trim();

        // 更新全局变量currentModel记录当前查询的型号
        if (modelInput) {
          currentModel = modelInput;
        }

        // 输入验证：确保用户输入了型号
        if (!modelInput) {
          alert("请输入轴承型号！");
          // 隐藏结果容器
          const resultDiv = document.getElementById("result");
          resultDiv.style.display = "none";
          return;
        }

        // 步骤2: 获取用户选择的各项辅助参数
        // 游隙选择（Clearance）- 轴承内部间隙的大小
        const clearance = document.querySelector('input[name="clearance"]:checked')?.value || '';

        // 振动加速度等级选择 - 衡量轴承运行时振动加速度的级别
        const vibAcc = document.querySelector('input[name="vibAcc"]:checked')?.value || '';

        // 振动速度等级选择 - 衡量轴承运行时振动速度的级别
        const vibVel = document.querySelector('input[name="vibVel"]:checked')?.value || '';

        // 公差等级选择 - 轴承尺寸和形状的精度等级
        const tolerance = document.querySelector('input[name="tolerance"]:checked')?.value || '';

        // 步骤3: 生成候选型号并尝试精确匹配
        // 通过generateCandidateModels函数生成可能的候选型号变体
        // （处理不同格式、省略符号等情况）
        const candidates = generateCandidateModels(modelInput);
        let matchedResults = []; // 存储所有精确匹配的型号和数据

        // 遍历候选型号列表，查找精确匹配
        for (const cand of candidates) {
          if (bearingData[cand]) { // 检查候选型号是否存在于轴承数据库中
            // 特殊处理：非标轴承
            if (cand === "非标轴承") {
              // 获取国标界面中的输入值
              const d = parseFloat(document.getElementById('dimension-d').value) || 0;
              const D = parseFloat(document.getElementById('dimension-D').value) || 0;
              const B = parseFloat(document.getElementById('dimension-B').value) || 0;

              // 执行型号查询，获取第一个高度匹配的轴承型号
              if (d > 0 && D > 0 && B > 0) {
                const matches = findBearingsByDimensions(d, D, B);
                // 过滤掉非标轴承本身，只保留标准轴承
                const standardMatches = matches.filter(match => match.model !== "非标轴承");
                if (standardMatches.length > 0) {
                  // 获取第一个高度匹配的标准轴承的倒角值
                  const firstMatch = standardMatches[0];
                  const firstBearing = firstMatch.bearing;

                  // 更新非标轴承的参数
                  bearingData[cand] = {
                    d: d,
                    D: D,
                    B: B,
                    ballSize: "",
                    ballCount: "",
                    centerDiameter: "",
                    rmin: firstBearing.rmin || 0,
                    Trmax: firstBearing.Trmax || 0,
                    Tamax: firstBearing.Tamax || 0
                  };
                }
              }
            }

            matchedResults.push({ model: cand, bearing: bearingData[cand] });
          }
        }

        // 如果找到了精确匹配，再查找该型号的所有变体型号（如 6306-GB、6306-2RS 等）
        // 但如果是从变体列表中已选定的模型，则跳过变体搜索，避免切换参数时再弹列表
        if (matchedResults.length > 0) {
          if (_modelSelectedFromList && matchedResults[0].model === currentModel) {
            // 已从列表选定，只取第一个匹配，不搜索变体
            matchedResults = [matchedResults[0]];
          } else {
            const baseModel = matchedResults[0].model;
            // 查找所有以该型号开头的其他变体（后缀模式）
            for (const [key, val] of Object.entries(bearingData)) {
              if (key !== baseModel && key.startsWith(baseModel) && !candidates.includes(key)) {
                matchedResults.push({ model: key, bearing: val });
              }
            }
          }
        }

        const resultDiv = document.getElementById("result");

        // 步骤4: 如果找到匹配的轴承型号
        if (matchedResults.length > 0) {
          if (matchedResults.length === 1) {
            // 只有一个匹配，直接显示
            currentModel = matchedResults[0].model;
            renderResult(matchedResults[0].model, matchedResults[0].bearing, tolerance, clearance, vibAcc, vibVel);
          } else {
            // 多个匹配（如 6306 和 6306-GB），显示选择列表
            currentModel = matchedResults[0].model;
            showModelSelectionList(matchedResults, tolerance, clearance, vibAcc, vibVel);
          }
          return; // 完成查询，结束函数执行
        }

        // 步骤5: 未找到精确匹配的型号，执行改进版相似型号推荐算法
        // 多维度轴承型号相似度评分算法
        // 算法原理：
        // - 通过5个不同维度的相似度计算，对轴承型号进行综合评分
        // - 每个维度赋予不同权重，确保重要特征优先匹配
        // - 最终根据总分排序，推荐最相似的轴承型号
        // 评分维度（按重要性排序）：
        // 相似性匹配算法：系列相似性(最高权重)、尺寸匹配、格式特征、字符位置、618/619特殊处理
        let candidateList = []; // 存储所有候选型号及其相似度分数

        // 5.1 提取输入型号的关键特征
        // 提取型号中的前两位数字作为系列标识（例如：6204中的"62"）
        const inputSeries = modelInput.replace(/[^0-9]/g, '').substring(0, 2);

        // 检查输入型号是否包含斜杠（某些特殊轴承型号格式特征）
        const inputHasSlash = modelInput.includes('/');

        // 新增：提取所有数字，用于68/69系列的特殊处理
        const inputNumbers = modelInput.replace(/[^0-9]/g, '');

        // 5.2 遍历所有轴承型号，计算与用户输入的多维度相似度
        for (const [key, val] of Object.entries(bearingData)) {
          let score = 0; // 初始化相似度分数

          // 维度1: 系列相似性（最高权重，100分）
          // 提取候选型号的前两位数字作为系列标识
          const candidateSeries = key.replace(/[^0-9]/g, '').substring(0, 2);

          if (candidateSeries === inputSeries) {
            // 完全相同的系列，给予最高分数
            score += 100;
          } else if (candidateSeries.charAt(0) === inputSeries.charAt(0)) {
            // 同一大类但不同系列（如60系列和62系列都属于6大类）
            score += 50;
          }

          // 维度2: 格式相似性（中等权重，30分）
          // 检查候选型号是否与输入型号具有相同的格式特征（斜杠）
          const candidateHasSlash = key.includes('/');
          if (candidateHasSlash === inputHasSlash) {
            score += 30;
          }

          // 维度3: 型号长度相似性（动态权重，最多20分）
          // 长度差异越小，分数越高，差异超过20则不再扣分
          const lengthDiff = Math.abs(key.length - modelInput.length);
          score += Math.max(0, 20 - lengthDiff);

          // 维度4: 字符位置相似性（编辑距离的简化版，按匹配字符数计算）
          // 逐字符比较，相同位置的字符匹配给予加分
          let charMatch = 0;
          const minLength = Math.min(key.length, modelInput.length);
          for (let i = 0; i < minLength; i++) {
            if (key[i] === modelInput[i]) charMatch++;
          }
          score += charMatch * 2;

          // 新增：68/69系列特殊处理 - 如果输入是68/69系列，优先推荐对应的618/619系列
          if ((modelInput.startsWith('68') && key.startsWith('618')) ||
            (modelInput.startsWith('69') && key.startsWith('619'))) {
            // 检查数字部分是否匹配（去掉前缀后的部分）
            const inputSuffix = inputNumbers.substring(2);
            const candidateSuffix = key.replace(/[^0-9]/g, '').substring(3); // 618/619有3个字符前缀
            // 如果输入只有'68'/'69'（没有后缀），或者后缀匹配，都给予加分
            if (inputNumbers.length <= 2 || inputSuffix === candidateSuffix) {
              score += 150; // 给予很高的优先级
            }
          }

          // 将计算好相似度的候选型号添加到列表中
          candidateList.push({ model: key, bearing: val, score });
        }

        // 5.3 按相似度得分从高到低排序候选型号
        candidateList.sort((a, b) => b.score - a.score);

        // 取前6个最相似型号作为推荐结果
        const top6 = candidateList.slice(0, 6);

        // 取前6个最相似型号作为推荐结果
        const topRecommendations = candidateList.slice(0, 6);

        // 构建推荐结果HTML（美化显示）
        let html = `<div class="recommendation-container" style="padding: 15px; border-radius: 8px; background-color: #f8f9fa; border: 1px solid #e9ecef;">`;
        html += `<h3 style="margin-top: 0; color: #333;">未找到完全匹配的型号</h3>`;
        html += `<p style="color: #666;">为您推荐以下相似型号：</p>`;

        // 添加68/69系列的特殊提示
        if (modelInput.startsWith('68') || modelInput.startsWith('69')) {
          html += `<div style="padding: 10px; background-color: #e3f2fd; border-left: 4px solid #2196f3; margin-bottom: 15px;">`;
          html += `<p style="margin: 0; color: #1565c0;">提示：您输入的是${modelInput.startsWith('68') ? '68' : '69'}系列，系统已优先推荐对应的61${modelInput.startsWith('68') ? '8' : '9'}系列型号</p>`;
          html += `</div>`;
        }

        html += `<div class="recommendations-list" style="display: grid; gap: 10px;">`;

        topRecommendations.forEach(item => {
          const { d, D, B } = item.bearing;
          html += `<div class="recommendation-item" 
                    onclick="selectRecommendedModel('${item.model}')" 
                    style="cursor: pointer; padding: 12px; border-radius: 6px; border: 1px solid #dee2e6; transition: all 0.3s; background-color: white;">
                    <div class="recommendation-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                      <strong style="color: #2196f3; font-size: 16px;">${item.model}</strong>
                      <span style="font-size: 12px; color: #666;">相似度: ${item.score}分</span>
                    </div>
                    <div class="recommendation-details" style="color: #555;">
                      尺寸: ${d}×${D}×${B} mm
                    </div>
                    <div class="recommendation-action" style="margin-top: 8px; text-align: right;">
                      <span style="font-size: 12px; color: #007bff; text-decoration: underline;">点击查看详情</span>
                    </div>
                  </div>`;
        });

        html += `</div>`;
        html += `<div style="margin-top: 15px; padding-top: 10px; border-top: 1px solid #dee2e6;">`;
        html += `<p style="font-size: 13px; color: #666; margin: 0;">提示：点击任意推荐型号可直接查看该型号的详细参数</p>`;
        html += `</div>`;
        html += `</div>`;

        resultDiv.innerHTML = html;
        resultDiv.style.display = "block";
      }

      // 显示型号选择列表（当输入匹配到多个变体时）
      function showModelSelectionList(matchedResults, tolerance, clearance, vibAcc, vibVel) {

            <p style="font-size: 13px; color: #666; margin: 0;">提示：点击任意型号可直接查看其详细参数</p>

      // 从型号选择列表中选择一个变体型号
      function selectVariantModel(model) {
        if (bearingData[model]) {
          document.getElementById('model').value = model;
          _modelSelectedFromList = true; // 标记已从列表选定，后续参数切换不再弹列表
          // 直接读取当前选中的参数，渲染结果，避免再次触发匹配逻辑导致死循环
          currentModel = model;

          const vibAcc = document.querySelector('input[name="vibAcc"]:checked')?.value || '';
          const vibVel = document.querySelector('input[name="vibVel"]:checked')?.value || '';
          const tolerance = document.querySelector('input[name="tolerance"]:checked')?.value || '';
          renderResult(model, bearingData[model], tolerance, clearance, vibAcc, vibVel);

      function selectRecommendedModel(model) {

      // 计算更多参数（挡边直径和额定载荷）
      function calculateMoreParams(model, bearing) {
        const { d, D, B, ballSize, ballCount, centerDiameter, rmin, D2, d2 } = bearing;
        const moreParams = [];

        // 获取用户输入的挡边系数、钢球系数、中心径和板宽系数
        const kd = parseFloat(document.getElementById('kd').value) || 0.36;
        const kd_inner = parseFloat(document.getElementById('kd_inner').value) || 0.38;
        const kw = parseFloat(document.getElementById('kw').value) || 0.28;
        const kc = parseFloat(document.getElementById('kc').value) || 0.5;
        const userInputCenterDiameter = parseFloat(document.getElementById('centerDiameter').value);

        // 计算中心圆直径
        let calculatedCenterDiameter = centerDiameter || (D + d) / 2;
        if (!isNaN(userInputCenterDiameter)) {
          calculatedCenterDiameter = userInputCenterDiameter;
        }

        // 如果用户手动修改了中心径，或者没有查表中心径，则在更多参数中显示中心径
        if (isCenterDiameterManuallyModified || !centerDiameter) {
          moreParams.push(['⭕ 中心径Dwp', `${calculatedCenterDiameter.toFixed(3)} mm`]);
        }

        // 智能计算钢球尺寸
        let calculatedBallSize = ballSize;

        console.log('calculateMoreParams - ballSize:', ballSize, 'isKwManuallyModified:', isKwManuallyModified, 'kw:', kw);

        if (!ballSize) {
          // 如果没有查表值，则计算钢球尺寸
          const theoreticalSize = kw * (D - d);
          calculatedBallSize = findClosestBallSize(theoreticalSize);
          // 修改：去掉"计算值"文字，只显示Kw系数
          moreParams.push(['🎱 钢球尺寸 Dw', `${calculatedBallSize} mm (Kw=${kw})`]);
          console.log('无查表值，计算钢球尺寸:', calculatedBallSize);
        } else if (isKwManuallyModified) {
          // 有查表值，但用户手动修改了钢球系数，则使用计算值
          const theoreticalSize = kw * (D - d);
          calculatedBallSize = findClosestBallSize(theoreticalSize);
          moreParams.push(['🎱 钢球尺寸 Dw', `${calculatedBallSize} mm (Kw=${kw})`]);
          console.log('手动修改，计算钢球尺寸:', calculatedBallSize);
        } else {
          console.log('使用查表值，不显示在更多参数中');
        }
        // 如果有查表值且用户没有手动修改钢球系数，则使用查表值（不显示在更多参数中）

        // 智能计算钢球数量
        let calculatedBallCount = ballCount;

        // 如果没有查表值，或者用户手动修改了钢球系数，则计算钢球数量
        if (!ballCount || isKwManuallyModified) {
          // 先尝试使用新的精确公式
          calculatedBallCount = calculateBallCount(calculatedCenterDiameter, calculatedBallSize || ballSize, kd);

          // 如果新公式失败，使用原来的简化公式
          if (calculatedBallCount === null) {
            calculatedBallCount = calculateBallCountOld(calculatedCenterDiameter, calculatedBallSize || ballSize, kd);
          }

          if (calculatedBallCount !== null) {
            moreParams.push(['🔢 钢球数量 Z', `${calculatedBallCount} 个`]);
          }
        }

        // 检查是否有必要的参数来计算
        const effectiveBallSize = calculatedBallSize || ballSize;
        const effectiveBallCount = calculatedBallCount || ballCount;

        if (!effectiveBallSize || !effectiveBallCount) {
          return moreParams; // 如果没有钢球尺寸或数量，无法进行后续计算
        }

        // 1. 计算挡边直径
        let calculatedD2 = null;
        let calculatedD2Inner = null;

        if (kd >= 0 && kd <= 1) {
          if (!D2) {
            // 如果没有查表值，则计算外圈挡边直径
            calculatedD2 = calculatedCenterDiameter + effectiveBallSize * (1 - kd);
            moreParams.push(['📐 外圈挡边D2', `${calculatedD2.toFixed(2)} mm (KD=${kd})`]);
          } else if (isKdManuallyModified) {
            // 有查表值，但用户手动修改了外挡系数，则使用计算值
            calculatedD2 = calculatedCenterDiameter + effectiveBallSize * (1 - kd);
            moreParams.push(['📐 外圈挡边D2', `${calculatedD2.toFixed(2)} mm (KD=${kd})`]);
          }
        }

        if (kd_inner >= 0 && kd_inner <= 1) {
          if (!d2) {
            // 如果没有查表值，则计算内圈挡边直径
            calculatedD2Inner = calculatedCenterDiameter - effectiveBallSize * (1 - kd_inner);
            moreParams.push(['📐 内圈挡边d2', `${calculatedD2Inner.toFixed(2)} mm (Kd=${kd_inner})`]);
          } else if (isKdInnerManuallyModified) {
            // 有查表值，但用户手动修改了内挡系数，则使用计算值
            calculatedD2Inner = calculatedCenterDiameter - effectiveBallSize * (1 - kd_inner);
            moreParams.push(['📐 内圈挡边d2', `${calculatedD2Inner.toFixed(2)} mm (Kd=${kd_inner})`]);
          }
        }

        // 2. 计算轴向游隙Gr参数
        if (effectiveBallSize) {
          // 获取当前选择的游隙组别
          const clearance = document.querySelector('input[name="clearance"]:checked')?.value;
          if (clearance) {
            // 根据轴承内径查找对应的游隙范围
            const cr = findInRanges(d, window.BearingData.clearanceRanges, clearance);
            if (cr) {
              // 解析径向游隙的最小值和最大值（μm）
              const [minRadialClearance, maxRadialClearance] = cr.split('～').map(val => parseFloat(val));

              if (!isNaN(minRadialClearance) && !isNaN(maxRadialClearance)) {
                // 将径向游隙转换为mm单位
                const minRadialClearanceMM = minRadialClearance / 1000;
                const maxRadialClearanceMM = maxRadialClearance / 1000;

                try {
                  // 计算轴向游隙最小值
                  const minParam = 1 - minRadialClearanceMM / (2 * 0.03 * effectiveBallSize);
                  const minAcos = Math.acos(Math.max(-1, Math.min(1, minParam))); // 确保参数在[-1,1]范围内
                  const minAxialClearanceMM = 2 * effectiveBallSize * 0.03 * Math.sin(minAcos);

                  // 计算轴向游隙最大值
                  const maxParam = 1 - maxRadialClearanceMM / (2 * 0.03 * effectiveBallSize);
                  const maxAcos = Math.acos(Math.max(-1, Math.min(1, maxParam))); // 确保参数在[-1,1]范围内
                  const maxAxialClearanceMM = 2 * effectiveBallSize * 0.03 * Math.sin(maxAcos);

                  // 转换为μm并添加到结果中
                  const minAxialClearanceUM = Math.round(minAxialClearanceMM * 1000);
                  const maxAxialClearanceUM = Math.round(maxAxialClearanceMM * 1000);

                  moreParams.push(['🔄 轴向游隙Gr', `${minAxialClearanceUM}～${maxAxialClearanceUM} μm`]);
                } catch (error) {
                  console.error('计算轴向游隙时出错:', error);
                }
              }
            }
          }
        }

        // 3. 计算轴承质量（仅在挡边直径和必要参数都可用时计算）
        if (effectiveBallSize && effectiveBallCount && calculatedCenterDiameter && rmin && D2 !== null && d2 !== null) {
          // 计算外圈质量
          const De = calculatedCenterDiameter + effectiveBallSize;
          const Re = 0.52 * effectiveBallSize;
          const outerMass = 7.83 * (
            0.785 * (Math.pow(D, 2) - Math.pow(D2, 2)) * B -
            1.349 * D * Math.pow(rmin, 2) -
            2.245 * Math.pow(0.5, 2) * D2 -
            1.345 * De * Math.pow(Re, 2) +
            0.6176 * Math.pow(Re, 3)
          ) / 1000;

          // 计算内圈质量
          const di = calculatedCenterDiameter - effectiveBallSize;
          const Ri = 0.515 * effectiveBallSize;
          const innerMass = 7.83 * (
            0.785 * (Math.pow(d2, 2) - Math.pow(d, 2)) * B -
            2.245 * d2 * Math.pow(0.5, 2) -
            1.349 * d * Math.pow(rmin, 2) -
            1.345 * di * Math.pow(Ri, 2) -
            0.6176 * Math.pow(Ri, 3)
          ) / 1000;

          // 计算钢球质量
          const ballVolume = (4 / 3) * Math.PI * Math.pow(effectiveBallSize / 2, 3);
          const ballMass = 7.83 * ballVolume / 1000 * effectiveBallCount;

          // 计算总质量，包含保持架质量计算
          const sqrtTerm = Math.sqrt(effectiveBallSize / 3 + 1.5625) - 1.25;
          const cageMassPart1 = 5.969925 / 1000 * Math.PI * (calculatedCenterDiameter + 0.36388 * effectiveBallCount * (effectiveBallSize * 0.515 + sqrtTerm / 2)) * effectiveBallSize * sqrtTerm;
          const cageMassPart2 = Math.PI * sqrtTerm * 4.5184 / 1000 * effectiveBallCount;
          const totalMass = outerMass + innerMass + ballMass + (cageMassPart1 + cageMassPart2);

          moreParams.push(['⚖️ 轴承质量M', `${totalMass.toFixed(1)} g`]);
        }

        // 4. 计算额定载荷
        if (calculatedCenterDiameter > 0) {
          // 获取用户输入的材料系数、滚珠列数和角接触角
          const bm = parseFloat(document.getElementById('bm').value) || 1.3;
          const i = parseFloat(document.getElementById('i').value) || 1;
          const alpha = parseFloat(document.getElementById('alpha').value) || 0;

          // 计算cosα
          const cosAlpha = Math.cos(alpha * Math.PI / 180); // 将角度转换为弧度后计算余弦值

          // 修改ratio的计算公式为：钢球尺寸*cosα/中心径尺寸
          const ratio = (effectiveBallSize * cosAlpha) / calculatedCenterDiameter;
          const fcValue = linearInterpolate(ratio, 'fc');
          const f0Value = linearInterpolate(ratio, 'f0');

          if (fcValue && f0Value) {
            let Cr;
            // 根据钢球尺寸选择不同的计算公式，并应用新的材料系数和滚珠列数因子
            if (effectiveBallSize <= 25.4) {
              Cr = bm * fcValue * Math.pow(effectiveBallCount, 2 / 3) * Math.pow(effectiveBallSize, 1.8) * Math.pow(i * cosAlpha, 0.7);
            } else {
              Cr = 3.647 * bm * fcValue * Math.pow(effectiveBallCount, 2 / 3) * Math.pow(effectiveBallSize, 1.4) * Math.pow(i * cosAlpha, 0.7);
            }

            // 添加到结果中（转换为KN）
            moreParams.push(['⚡额定动载荷Cr', `${(Cr / 1000).toFixed(2)} KN`]);

            // 计算径向基本额定静载荷 C0r，并乘以滚珠列数i*cosα
            const C0r = f0Value * effectiveBallCount * Math.pow(effectiveBallSize, 2) * i * cosAlpha;
            moreParams.push(['⚡额定静载荷Cor', `${(C0r / 1000).toFixed(2)} KN`]);

            // 计算保持架板厚S
            if (effectiveBallSize) {
              // 获取用户选择的板厚值
              const userCageThickness = parseFloat(document.getElementById('cageThickness').value);

              let finalThickness;

              // 如果用户选择了自定义值（不为0），则使用用户选择的值
              if (userCageThickness && userCageThickness > 0) {
                finalThickness = userCageThickness;
              } else {
                // 否则使用计算值
                const specificSeries = model === "非标轴承" ? "2" : getBearingSeries(model);
                let cageThicknessS = 0;

                switch (specificSeries) {
                  case "8":
                    if (effectiveBallSize <= 2.381) {
                      cageThicknessS = Math.sqrt(effectiveBallSize / 2.2 + Math.pow(1.25, 2)) - 1.3;
                    } else if (effectiveBallSize > 2.381 && effectiveBallSize < 18) {
                      cageThicknessS = Math.sqrt(effectiveBallSize / 1.9 + Math.pow(1.25, 2)) - 1.25;
                    }
                    break;
                  case "9":
                    cageThicknessS = Math.sqrt(effectiveBallSize / 2.4 + Math.pow(1.25, 2)) - 1.17;
                    break;
                  case "0":
                    cageThicknessS = Math.sqrt(effectiveBallSize / 3 + Math.pow(1.25, 2)) - 1.25;
                    break;
                  case "1":
                    cageThicknessS = Math.sqrt(effectiveBallSize / 3.174 + Math.pow(1.25, 2)) - 1.25;
                    break;
                  case "2":
                    cageThicknessS = Math.sqrt(effectiveBallSize / 6.3 - 0.5) - 0.04;
                    break;
                  case "3":
                    cageThicknessS = Math.sqrt(effectiveBallSize / 8.5 - 0.5) + 0.15;
                    break;
                  case "4":
                    cageThicknessS = Math.sqrt(effectiveBallSize / 8.5 - 0.5) + 0.4;
                    break;
                }

                // 标准板厚值列表
                const standardThicknesses = [0.5, 0.6, 0.7, 0.8, 1.0, 1.2, 1.5, 2.0];

                // 找到最接近的标准值
                let closestThickness = standardThicknesses[0];
                let minDifference = Math.abs(cageThicknessS - closestThickness);

                for (let i = 1; i < standardThicknesses.length; i++) {
                  const currentDifference = Math.abs(cageThicknessS - standardThicknesses[i]);
                  if (currentDifference < minDifference) {
                    minDifference = currentDifference;
                    closestThickness = standardThicknesses[i];
                  }
                }

                finalThickness = closestThickness;
              }

              if (finalThickness > 0) {
                moreParams.push(['📏 保持架板厚S', `${finalThickness.toFixed(1)} mm`]);

                // 根据板厚S计算铆钉孔直径dm
                let rivetHoleDiameter = '';
                switch (finalThickness) {
                  case 0.5:
                  case 0.6:
                    rivetHoleDiameter = '0.8';
                    break;
                  case 0.7:
                    rivetHoleDiameter = '0.8/1.0';
                    break;
                  case 0.8:
                    rivetHoleDiameter = '1.0';
                    break;
                  case 1.0:
                    rivetHoleDiameter = '1.0/1.2/1.5';
                    break;
                  case 1.2:
                    rivetHoleDiameter = '1.2/1.5';
                    break;
                  case 1.5:
                    rivetHoleDiameter = '2.0/2.5/3.0';
                    break;
                  case 2.0:
                    rivetHoleDiameter = '3.0/3.5';
                    break;
                }

                if (rivetHoleDiameter) {
                  moreParams.push(['🔩 铆钉孔直径dm', `${rivetHoleDiameter} mm`]);
                }

                // 计算保持架外径Dc
                const cageOuterDiameter = calculatedCenterDiameter + kc * effectiveBallSize;
                moreParams.push(['⭕ 保持架外径Dc', `${cageOuterDiameter.toFixed(2)} mm`]);

                // 计算保持架内径dc
                const cageInnerDiameter = calculatedCenterDiameter - kc * effectiveBallSize;
                moreParams.push(['⭕ 保持架内径dc', `${cageInnerDiameter.toFixed(2)} mm`]);
              }
            }
          }
        }
        return moreParams;
      }

      // 搜索工艺参数数据
      function searchProcessData() {
        try {
          const customerInput = document.getElementById('processCustomer');
          const modelInput = document.getElementById('processModel');
          const salespersonInput = document.getElementById('processSalesperson');

          if (!customerInput || !modelInput || !salespersonInput) {
            console.error('找不到查询输入框');
            alert('页面元素加载不完整，请刷新页面后重试。');
            return;
          }

          const customer = customerInput.value.trim();
          const model = modelInput.value.trim();
          const salesperson = salespersonInput.value.trim();

          // 如果型号输入框有内容，显示相关型号建议
          if (model) {
            showModelSuggestions();
          }

          // 数据过滤
          filteredProcessData = bearingProcessData.filter(item => {
            try {
              const matchCustomer = !customer || (item['客户名称'] && item['客户名称'].includes(customer));
              // 型号匹配逻辑（使用通用匹配函数）
              const productModel = item['产品型号'] || '';
              const modelMatched = matchModel(model, productModel);
              const matchSalesperson = !salesperson || (item['销售人员'] && item['销售人员'].includes(salesperson));
              return matchCustomer && modelMatched && matchSalesperson;
            } catch (filterError) {
              console.error('过滤数据时出错:', filterError);
              return false;
            }
          });

          currentProcessPage = 1;
          renderProcessResults();
          renderProcessPagination();

          // 如果所有输入框都为空，重新显示分页控件
          if (!customer && !model && !salesperson) {
            const paginationElement = document.getElementById('processPagination');
            if (paginationElement) {
              paginationElement.style.display = '';
            }
          }

          const totalCountElement = document.getElementById('processTotalCount');
          if (totalCountElement) {
            totalCountElement.textContent = filteredProcessData.length;
          }
        } catch (error) {
          console.error('工艺参数查询时出错:', error);
          alert('查询过程中发生错误，请查看控制台了解详情。');
        }
      }

      // 处理工艺参数输入框的按键事件（回车查询）
      function handleProcessInputKey(event) {
        if (event.key === 'Enter') {
          searchProcessData();
        }
      }

      /**
       * 处理工艺参数输入框的自动查询功能（防抖500ms）
       */
      let processSearchTimeout;
      function handleProcessInputAutoSearch() {
        // 清除之前的定时器
        clearTimeout(processSearchTimeout);

        // 设置新的定时器，延迟500ms执行查询
        processSearchTimeout = setTimeout(function () {
          // 先显示型号建议
          showModelSuggestions();
          // 然后执行搜索
          searchProcessData();
        }, 500);

      /**
       * 显示型号建议列表（类似游隙状态的涉及型号功能）
       */
      function showModelSuggestions() {
        try {
          const modelInput = document.getElementById('processModel');
          if (!modelInput) return;

          const inputValue = modelInput.value.trim();
          if (!inputValue) {
            // 如果输入为空，清除之前的建议
            const existingSuggestions = document.getElementById('modelSuggestionsContainer');
            if (existingSuggestions) {
              existingSuggestions.remove();
            }
            return;
          }

          // 搜索匹配的型号（支持精确匹配和模糊匹配）
          const matchingModels = new Set();
          bearingProcessData.forEach(item => {
            const productModel = item['产品型号'] || '';
            if (productModel) {
              // 使用通用匹配函数
              if (matchModel(inputValue, productModel)) {
                matchingModels.add(productModel);
              }
            }
          });

          if (matchingModels.size === 0) return;

          // 如果只有一个匹配的型号，不显示建议
          if (matchingModels.size === 1) {
            // 移除之前的建议容器
            const existingSuggestions = document.getElementById('modelSuggestionsContainer');
            if (existingSuggestions) {
              existingSuggestions.remove();
            }
            return;
          }

          // 移除之前的建议容器
          const existingSuggestions = document.getElementById('modelSuggestionsContainer');
          if (existingSuggestions) {
            existingSuggestions.remove();
          }

          // 创建建议容器
          const suggestionsContainer = document.createElement('div');
          suggestionsContainer.id = 'modelSuggestionsContainer';
          suggestionsContainer.style.margin = '10px 0';
          suggestionsContainer.style.padding = '10px';
          suggestionsContainer.style.backgroundColor = 'rgba(46, 204, 113, 0.1)';
          suggestionsContainer.style.borderRadius = '6px';
          suggestionsContainer.style.color = '#2ecc71';
          suggestionsContainer.style.boxSizing = 'border-box';

          // 构建建议型号的HTML，添加点击事件
          const modelsArray = Array.from(matchingModels).slice(0, 20); // 限制显示前20个
          const modelsHTML = modelsArray.map(m =>
            `<span style="color: #3498db; cursor: pointer; display: inline-block;" onclick="selectModelSuggestion('${m}')">${m}</span>`
          ).join('、');

          suggestionsContainer.innerHTML = `相关型号：${modelsHTML}`;

          // 在整个参数行容器下方插入建议
          const paramsRowContainers = document.querySelectorAll('.params-row-container');
          const searchFormRow = paramsRowContainers[0]; // 第一个参数行容器是搜索表单
          if (searchFormRow) {
            // 在搜索表单行后插入建议
            searchFormRow.parentNode.insertBefore(suggestionsContainer, searchFormRow.nextSibling);
          } else {
            // 如果没有找到参数行容器，就退回到在输入框下方插入
            modelInput.parentNode.insertBefore(suggestionsContainer, modelInput.nextSibling);
          }
        } catch (error) {
          console.error('显示型号建议时出错:', error);
        }
      }

      /**
       * 选择型号建议
       */
      function selectModelSuggestion(model) {
        const modelInput = document.getElementById('processModel');
        if (modelInput) {
          modelInput.value = model;
          // 移除建议容器
          const suggestionsContainer = document.getElementById('modelSuggestionsContainer');
          if (suggestionsContainer) {
            suggestionsContainer.remove();
          }
          // 执行搜索
          searchProcessData();
        }
      }

      /**
       * 显示径向游隙统计与关联查询结果
       * 修复安卓程序中需要点击两次的问题：
       * 1. 清除自动查询定时器，避免输入框的自动查询与按钮点击冲突
       * 2. 确保使用最新的输入值进行游隙统计
       */
      function showClearanceStatistics() {
        try {
          // 清除自动查询定时器，避免与游隙统计冲突
          clearTimeout(processSearchTimeout);

          const modelInput = document.getElementById('processModel');
          const customerInput = document.getElementById('processCustomer');
          const salespersonInput = document.getElementById('processSalesperson');

          if (!modelInput || !customerInput || !salespersonInput) {
            console.error('找不到输入框元素');
            alert('页面元素加载不完整，请刷新页面后重试。');
            return;
          }

          // 获取所有输入值
          const model = modelInput.value.trim();
          const customer = customerInput.value.trim();
          const salesperson = salespersonInput.value.trim();

          // 如果所有输入框都为空，提示用户至少输入一个条件
          if (!model && !customer && !salesperson) {
            alert('请至少输入一个查询条件：产品型号、客户名称或销售员');
            return;
          }

          // 数据过滤 - 基于多条件联合筛选
          const matchingRecords = bearingProcessData.filter(item => {
            try {
              // 获取产品型号、客户名称和销售员信息
              const productModel = item['产品型号'] || '';
              const itemCustomer = item['客户名称'] || '';
              const itemSalesperson = item['销售人员'] || '';

              // 所有非空条件都必须满足
              const modelMatched = matchModel(model, productModel);
              let matchCustomer = !customer || itemCustomer.includes(customer);
              let matchSalesperson = !salesperson || itemSalesperson.includes(salesperson);

              // 返回同时满足所有条件的结果
              return modelMatched && matchCustomer && matchSalesperson;
            } catch (error) {
              console.error('过滤数据时出错:', error);
              return false;
            }
          });

          // 生成查询条件描述字符串
          let conditionDesc = getModelConditionDesc(model);
          if (customer) {
            conditionDesc += conditionDesc ? `、客户名称包含"${customer}"` : `客户名称包含"${customer}"`;
          }
          if (salesperson) {
            conditionDesc += conditionDesc ? `、销售员包含"${salesperson}"` : `销售员包含"${salesperson}"`;
          }

          if (matchingRecords.length === 0) {
            alert(`未找到与以下条件相关的记录：${conditionDesc}`);
            return;
          }

          // 按径向游隙和内控游隙分组并统计客户信息
          const clearanceMap = new Map();

          matchingRecords.forEach(record => {
            const radialClearance = record['径向游隙'] || '未指定';
            const axialClearance = record['内控游隙'] || '未指定';
            // 使用组合键作为Map的键
            const clearanceKey = `${radialClearance}|${axialClearance}`;
            const customer = record['客户名称'] || '未知客户';

            if (!clearanceMap.has(clearanceKey)) {
              clearanceMap.set(clearanceKey, {
                radialClearance: radialClearance,
                axialClearance: axialClearance,
                customers: new Set()
              });
            }

            clearanceMap.get(clearanceKey).customers.add(customer);
          });

          // 显示统计结果
          displayClearanceStatistics(clearanceMap, conditionDesc);
        } catch (error) {
          console.error('显示游隙统计时出错:', error);
          alert('统计过程中发生错误，请查看控制台了解详情。');
        }
      }
