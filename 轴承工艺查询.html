      function showTaxIncludedPriceStatistics() {
        try {
          // 首先检查sessionStorage中的验证状态（更可靠）
          const isVerifiedInSession = sessionStorage.getItem('priceParamsVerified') === 'true';
          // 同时检查全局变量和DOM状态
          const passwordContainer = document.getElementById('passwordContainer');
          const isContainerHidden = passwordContainer && passwordContainer.style.display === 'none';
          const isGloballyVerified = window.isPricePasswordVerified === true;

          // 只有在任一验证方式通过时才允许访问
          if (!isVerifiedInSession && !isContainerHidden && !isGloballyVerified) {
            // 直接显示密码输入框而不是提示消息
            showPricePasswordInput();
            return;
          }

          // 如果通过验证但全局变量未设置，则更新全局变量
          if (isVerifiedInSession || isContainerHidden) {
            window.isPricePasswordVerified = true;
          }

          // 清除自动查询定时器，避免与含税售价统计冲突
          clearTimeout(processSearchTimeout);

          const modelInput = document.getElementById('processModel');
          const customerInput = document.getElementById('processCustomer');
          const salespersonInput = document.getElementById('processSalesperson');

          if (!modelInput || !customerInput || !salespersonInput) {
            console.error('找不到输入框元素');
            alert('页面元素加载不完整，请刷新页面后重试。');
            return;
          }

          // 获取所有输入值
          const model = modelInput.value.trim();
          const customer = customerInput.value.trim();
          const salesperson = salespersonInput.value.trim();

          // 如果所有输入框都为空，提示用户至少输入一个条件
          if (!model && !customer && !salesperson) {
            alert('请至少输入一个查询条件：产品型号、客户名称或销售员');
            return;
          }

          // 数据过滤 - 基于多条件联合筛选
          const matchingRecords = bearingProcessData.filter(item => {
            try {
              // 获取产品型号、客户名称和销售员信息
              const productModel = item['产品型号'] || '';
              const itemCustomer = item['客户名称'] || '';
              const itemSalesperson = item['销售人员'] || '';

              // 所有非空条件都必须满足
              const modelMatched = matchModel(model, productModel);
              let matchCustomer = !customer || itemCustomer.includes(customer);
              let matchSalesperson = !salesperson || itemSalesperson.includes(salesperson);

              // 返回同时满足所有条件的结果
              return modelMatched && matchCustomer && matchSalesperson;
            } catch (error) {
              console.error('过滤数据时出错:', error);
              return false;
            }
          });

          // 生成查询条件描述字符串
          let conditionDesc = getModelConditionDesc(model);
          if (customer) {
            conditionDesc += conditionDesc ? `、客户名称包含"${customer}"` : `客户名称包含"${customer}"`;
          }
          if (salesperson) {
            conditionDesc += conditionDesc ? `、销售员包含"${salesperson}"` : `销售员包含"${salesperson}"`;
          }

          if (matchingRecords.length === 0) {
            alert(`未找到与以下条件相关的记录：${conditionDesc}`);
            return;
          }

          // 按含税售价分组并统计客户信息
          const priceMap = new Map();

          matchingRecords.forEach(record => {
            const taxIncludedPrice = record['含税售价'] || '未指定';
            const customer = record['客户名称'] || '未知客户';

            if (!priceMap.has(taxIncludedPrice)) {
              priceMap.set(taxIncludedPrice, {
                taxIncludedPrice: taxIncludedPrice,
                customers: new Set()
              });
            }

            priceMap.get(taxIncludedPrice).customers.add(customer);
          });

          // 显示统计结果
          displayTaxIncludedPriceStatistics(priceMap, conditionDesc);
        } catch (error) {
          console.error('显示含税售价统计时出错:', error);
          alert('统计过程中发生错误，请查看控制台了解详情。');
        }
      }

      // 显示含税售价统计结果表格
      function displayTaxIncludedPriceStatistics(priceMap, conditionDesc) {
        try {
          const container = document.getElementById('processResultsContainer');
          if (!container) {
            console.error('找不到结果容器');
            return;
          }

          // 清空容器
          container.innerHTML = '';

          // 预先检测屏幕宽度，但始终显示客户清单列（包括手机界面）
          const isMobile = window.innerWidth <= 768;
          const shouldShowCustomersColumn = true; // 始终显示客户清单列

          // 不再显示统计信息标题，直接创建表格

          // 创建表格
          const table = document.createElement('table');
          table.className = 'result-table';
          table.style.tableLayout = 'auto'; // 允许表格根据内容自动调整列宽
          table.style.width = '100%'; // 确保表格占满容器
          table.style.borderCollapse = 'collapse';
          table.style.backgroundColor = 'rgba(255, 255, 255, 0.05)';
          table.style.borderRadius = '5px';
          table.style.overflow = 'hidden';

          // 创建表头
          const thead = document.createElement('thead');
          const headerRow = document.createElement('tr');

          // 创建表头单元格
          const headerConfigs = [
            { text: '序号', width: 'auto', minWidth: '20px' },
            { text: '含税售价', width: 'auto', minWidth: '120px' }
          ];

          // 仅在非移动设备上添加客户清单列
          if (shouldShowCustomersColumn) {
            headerConfigs.push({ text: '客户清单', width: '100%' });
          }

          headerConfigs.forEach(config => {
            const th = document.createElement('th');
            th.textContent = config.text;
            th.style.width = config.width;
            th.style.minWidth = config.minWidth || 'auto';
            th.style.padding = '12px';
            th.style.textAlign = 'center';
            th.style.borderBottom = '2px solid #9b59b6';
            th.style.fontWeight = 'bold';
            th.style.whiteSpace = 'nowrap'; // 确保内容不换行

            // 为客户清单表头添加标识，方便后续隐藏操作
            if (config.text === '客户清单') {
              th.id = 'price-customers-header';
              th.classList.add('price-customers-header');
            }

            headerRow.appendChild(th);
          });

          thead.appendChild(headerRow);
          table.appendChild(thead);

          // 创建表体
          const tbody = document.createElement('tbody');
          let index = 1;

          // 将Map转换为数组并按含税售价排序（数字在前，空值在后）
          const sortedPrices = Array.from(priceMap.entries()).sort((a, b) => {
            const priceA = a[0];
            const priceB = b[0];

            // 处理空值和未指定的情况
            if (priceA === '未指定' && priceB !== '未指定') return 1;
            if (priceA !== '未指定' && priceB === '未指定') return -1;
            if (priceA === '未指定' && priceB === '未指定') return 0;

            // 比较数字价格
            const numA = parseFloat(priceA);
            const numB = parseFloat(priceB);
            if (!isNaN(numA) && !isNaN(numB)) {
              return numA - numB;
            }

            return priceA.localeCompare(priceB);
          });

          // 填充表格数据
          sortedPrices.forEach(([price, data]) => {
            const row = document.createElement('tr');
            row.style.borderBottom = '1px solid rgba(255, 255, 255, 0.1)';
            row.style.transition = 'background-color 0.2s';
            row.onmouseover = () => {
              row.style.backgroundColor = 'rgba(155, 89, 182, 0.1)';
            };
            row.onmouseout = () => {
              row.style.backgroundColor = 'transparent';
            };

            // 创建序号单元格
            const indexCell = document.createElement('td');
            indexCell.textContent = index++;
            indexCell.style.padding = '8px 4px';
            indexCell.style.textAlign = 'center';
            indexCell.style.verticalAlign = 'top';
            row.appendChild(indexCell);

            // 创建含税售价单元格
            const priceCell = document.createElement('td');
            priceCell.textContent = data.taxIncludedPrice;
            priceCell.style.padding = '8px 4px';
            priceCell.style.textAlign = 'center';
            priceCell.style.verticalAlign = 'top';
            priceCell.style.whiteSpace = 'nowrap';
            // 添加紫色加粗样式，与表头背景色一致
            priceCell.style.color = '#9b59b6';
            priceCell.style.fontWeight = 'bold';
            row.appendChild(priceCell);

            // 创建客户清单单元格
            if (shouldShowCustomersColumn) {
              const customersCell = document.createElement('td');
              customersCell.style.padding = '8px';
              customersCell.style.textAlign = 'left';
              customersCell.style.verticalAlign = 'top';

              const customersList = Array.from(data.customers).sort().join('、 ');
              const customersSpan = document.createElement('span');

              // 创建内容容器
              const contentContainer = document.createElement('div');
              contentContainer.dataset.fullContent = customersList;
              customersSpan.textContent = customersList;
              customersSpan.style.display = 'block';
              customersSpan.style.wordWrap = 'break-word';
              customersSpan.style.lineHeight = '1.4';
              contentContainer.appendChild(customersSpan);
              customersCell.appendChild(contentContainer);

              // 处理客户清单列的显示和截断（所有设备统一）
              const cellId = 'price-customer-cell-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
              contentContainer.id = cellId;

              // 使用异步方式检查内容行数，确保DOM已渲染
              setTimeout(function () {
                const elementToCheck = document.getElementById(cellId);
                if (elementToCheck) {
                  // 设置基础样式用于计算行数
                  elementToCheck.style.height = 'auto';
                  elementToCheck.style.width = '100%';
                  elementToCheck.style.whiteSpace = 'normal';
                  elementToCheck.style.wordWrap = 'break-word';

                  // 获取行高和内容高度
                  const lineHeight = parseInt(window.getComputedStyle(elementToCheck).lineHeight) || 20;
                  const contentHeight = elementToCheck.offsetHeight;
                  const lineCount = Math.ceil(contentHeight / lineHeight);

                  // 如果内容超过两行，则添加截断和点击展开功能
                  if (lineCount > 2) {
                    if (customersCell) {
                      // 设置为可点击状态
                      customersCell.style.cursor = 'pointer';

                      // 设置容器样式以限制显示行数
                      elementToCheck.style.overflow = 'hidden';
                      elementToCheck.style.display = '-webkit-box';
                      elementToCheck.style.webkitLineClamp = '2';
                      elementToCheck.style.webkitBoxOrient = 'vertical';
                      elementToCheck.style.lineHeight = lineHeight + 'px';
                      elementToCheck.style.textOverflow = 'ellipsis';

                      // 添加点击事件处理展开/收起
                      let isExpanded = false;
                      customersCell.addEventListener('click', function (e) {
                        e.stopPropagation(); // 阻止冒泡到行点击事件
                        if (isExpanded) {
                          // 收起：恢复截断显示
                          elementToCheck.style.overflow = 'hidden';
                          elementToCheck.style.display = '-webkit-box';
                          elementToCheck.style.webkitLineClamp = '2';
                          elementToCheck.style.webkitBoxOrient = 'vertical';
                          elementToCheck.textContent = elementToCheck.dataset.fullContent;
                          isExpanded = false;
                        } else {
                          // 展开：显示全部内容
                          elementToCheck.style.overflow = 'visible';
                          elementToCheck.style.display = 'block';
                          elementToCheck.style.webkitLineClamp = 'unset';
                          elementToCheck.style.webkitBoxOrient = 'unset';
                          elementToCheck.textContent = elementToCheck.dataset.fullContent;
                          isExpanded = true;
                        }
                      });
                    }
                  }
                }
              }, 100);

              row.appendChild(customersCell);
            }

            // 使用通用handleWindowResize函数处理含税售价统计表格
            if (!window.priceCustomerColumnResizeHandler) {
              window.priceCustomerColumnResizeHandler = function () {
                handleWindowResize('price');
              };
              window.addEventListener('resize', window.priceCustomerColumnResizeHandler);
            }

            tbody.appendChild(row);
          });

          table.appendChild(tbody);
          container.appendChild(table);



          /**
           * 根据精确型号筛选含税售价
           * @param {string} exactModel - 精确的轴承型号
           */
          window.filterByExactModelForPrice = function (exactModel) {
            try {
              // 获取客户名称和销售员输入框的值
              const customer = document.getElementById('processCustomer')?.value.trim() || '';
              const salesperson = document.getElementById('processSalesperson')?.value.trim() || '';

              // 搜索完全匹配该型号且满足客户和销售员筛选条件的记录
              const exactMatchingRecords = bearingProcessData.filter(item => {
                const matchModel = item['产品型号'] && item['产品型号'] === exactModel;
                const matchCustomer = !customer || (item['客户名称'] && item['客户名称'].includes(customer));
                const matchSalesperson = !salesperson || (item['销售人员'] && item['销售人员'].includes(salesperson));
                return matchModel && matchCustomer && matchSalesperson;
              });

              if (exactMatchingRecords.length === 0) {
                alert(`未找到型号"${exactModel}"的记录`);
                return;
              }

              // 按含税售价分组并统计客户信息
              const filteredPriceMap = new Map();

              exactMatchingRecords.forEach(record => {
                const taxIncludedPrice = record['含税售价'] || '未指定';
                const customer = record['客户名称'] || '未知客户';

                if (!filteredPriceMap.has(taxIncludedPrice)) {
                  filteredPriceMap.set(taxIncludedPrice, {
                    taxIncludedPrice: taxIncludedPrice,
                    customers: new Set()
                  });
                }

                filteredPriceMap.get(taxIncludedPrice).customers.add(customer);
              });

              // 构建查询条件描述
              let conditionDesc = `型号"${exactModel}"`;
              if (customer) {
                conditionDesc += `、客户名称包含"${customer}"`;
              }
              if (salesperson) {
                conditionDesc += `、销售员包含"${salesperson}"`;
              }

              // 显示筛选后的统计结果
              displayTaxIncludedPriceStatistics(filteredPriceMap, conditionDesc, new Set([exactModel]));

              // 筛选后重新触发窗口大小变化处理，确保客户清单列显示正确
              setTimeout(() => {
                if (window.priceCustomerColumnResizeHandler) {
                  window.priceCustomerColumnResizeHandler();
                }
              }, 200);
            } catch (error) {
              console.error('按型号筛选时出错:', error);
              alert('筛选过程中发生错误，请查看控制台了解详情。');
            }
          }



          // 更新总数显示
          const totalCountElement = document.getElementById('processTotalCount');
          if (totalCountElement) {
            totalCountElement.textContent = ` ${priceMap.size} `;
          }

          // 隐藏分页控件
          const paginationElement = document.getElementById('processPagination');
          if (paginationElement) {
            paginationElement.style.display = 'none';
          }
        } catch (error) {
          console.error('显示含税售价统计结果表格时出错:', error);
          alert('显示统计结果时发生错误，请查看控制台了解详情。');
        }
      }

    </script>
    <!-- 底部工具栏 -->
    <div class="bottom-toolbar">
      <button id="toolbar-gbquery" class="toolbar-button" onclick="toggleDimensionQuery()">
        <span class="toolbar-icon">📊</span>
        <span class="toolbar-text">国标</span>
      </button>
      <button id="toolbar-process" class="toolbar-button active" onclick="toggleProcessQuery()">
        <span class="toolbar-icon">🔧</span>
        <span class="toolbar-text">工艺</span>
      </button>
      <button id="toolbar-about" class="toolbar-button" onclick="toggleAboutPage()">
        <span class="toolbar-icon">ℹ️</span>
        <span class="toolbar-text">更多</span>
      </button>
    </div>

    <!-- 更多页面（默认隐藏） -->
    <div id="aboutSection" style="display: none; padding: 15px; max-width: 1200px; margin: 0 auto; z-index: 999;">
      <div class="about-container">
        <div class="about-info">

          <!-- 紧凑布局 -->
          <div class="about-row">
            <div class="about-section">
              <ul class="about-list">
                <li><strong>开发人员:</strong> momo</li>
                <li><strong>开发公司:</strong> 安徽日飞轴承有限公司</li>
              </ul>
              <div style="margin-top: 15px;">
                <div id="update-status" class="update-status">上次检查: 从未</div>
                <button id="check-update-button" class="update-check-btn" style="margin-top: 10px;"
                  onclick="checkForUpdates()">检查更新</button>
                <div id="update-progress" class="update-progress">
                  <div id="download-status-text" class="download-status">下载中...</div>
                  <div class="progress-bar-container">
                    <div id="progress-bar" class="progress-bar"></div>
                  </div>
                  <div id="progress-percentage" class="progress-percentage">0%</div>
                </div>
                <div id="update-actions" class="update-actions">
                  <button id="install-update-button" class="update-install-btn" onclick="installUpdate()">安装更新</button>
                  <button id="cancel-update-button" class="update-cancel-btn" onclick="cancelUpdate()">取消</button>
                </div>
              </div>
            </div>
          </div>

          <div style="display: flex; gap: 20px; flex-wrap: wrap;">
            <div class="about-section" style="flex: 1; min-width: 280px;">
              <h5 class="about-section-title">相关工具</h5>
              <div
                style="margin-top: 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;">
                <button id="open-bearing-ref-btn" class="update-check-btn"
                  onclick="openBearingReference()">常用轴承型号对照表</button>
                <button id="open-price-ref-btn" class="update-check-btn"
                  onclick="openPriceReference()">历史销售价与采购价</button>
                <button id="open-ball-price-btn" class="update-check-btn"
                  onclick="openBallPriceCalculator()">钢球价格吨粒换算器</button>
                <button id="open-deep-groove-btn" class="update-check-btn"
                  onclick="openDeepGrooveBearingClearanceCalculator()">球轴承有效游隙计算</button>
                <button id="open-tolerance-query-btn" class="update-check-btn"
                  onclick="openToleranceQuery()">公差配合尺寸查询</button>
                <button id="theme-toggle-button" class="update-check-btn" onclick="toggleTheme()">
                  <span id="theme-toggle-text">切换到亮色主题</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 更多页面样式已迁移到 styles.css 文件中 -->
    </div>

    <script>
      // 增强的辅助函数：获取元素并进行操作，支持ID选择器和类选择器
      function safeElement(selector, callback) {
        const element = selector.startsWith('.') ?
          document.querySelector(selector) :
          document.getElementById(selector.replace('#', ''));
        if (element) callback(element);
      }

      // 辅助函数：显示/隐藏元素
      function toggleElement(selector, show) {
        safeElement(selector, el => el.style.display = show ? 'block' : 'none');
      }

      // 更新工具栏活动状态
      function updateToolbarActiveState() {
        const buttons = ['toolbar-gbquery', 'toolbar-process', 'toolbar-about'];
        // 重置所有按钮的活动状态
        buttons.forEach(id => safeElement(id, btn => btn.classList.remove('active')));

        // 确定当前显示的是哪个部分并设置活动状态
        const aboutVisible = document.getElementById('aboutSection')?.style.display === 'block';
        const processVisible = document.getElementById('processQuerySection')?.style.display === 'block';
        const activeButton = aboutVisible ? buttons[2] : (processVisible ? buttons[1] : buttons[0]);
        safeElement(activeButton, btn => btn.classList.add('active'));
      }

      // 扩展页面切换函数，添加工具栏状态更新
      const originalToggleProcessQuery = toggleProcessQuery;
      toggleProcessQuery = () => {
        toggleElement('aboutSection', false);
        originalToggleProcessQuery();
        updateToolbarActiveState();
      };

      const originalToggleDimensionQuery = toggleDimensionQuery;
      toggleDimensionQuery = () => {
        toggleElement('aboutSection', false);
        originalToggleDimensionQuery();
        updateToolbarActiveState();
      };

      // 统一的页面切换函数
      function togglePage(pageType) {
        // 重置所有页面
        toggleElement('aboutSection', false);
        toggleElement('processQuerySection', false);
        toggleElement('.content-wrapper', false);

        // 根据页面类型显示对应内容
        if (pageType === 'about') toggleElement('aboutSection', true);
        else if (pageType === 'process') toggleElement('processQuerySection', true);
        else if (pageType === 'dimension') toggleElement('.content-wrapper', true);

        // 更新工具栏状态
        updateToolbarActiveState();
      }

      // 兼容原有函数调用
      function toggleAboutPage() {
        togglePage('about');
      }

      function closeAboutPage() {
        togglePage('dimension'); // 默认回到国标查询页面
      }

      // 客户弹窗通用函数 - 显示客户列表弹窗
      function showCustomersPopupCommon(rowElement, type = 'process') {
        try {
          const customersArray = JSON.parse(rowElement.dataset.customersArray || '[]');
          const popupId = type === 'vibration' ? 'vibration-customers-popup' : 'customers-popup';
          const overlayId = type === 'vibration' ? 'vibration-popup-overlay' : 'popup-overlay';
          const contentId = type === 'vibration' ? 'vibration-popup-customers-content' : 'popup-customers-content';

          const popupContent = document.getElementById(contentId);
          if (!popupContent) {
            console.error(`找不到弹窗内容元素: ${contentId}`);
            return;
          }

          // 根据屏幕宽度调整弹窗宽度，比主容器稍小
          const popup = document.getElementById(popupId);
          if (popup) {
            popup.style.width = '75%';
            popup.style.maxWidth = '75%';
          }

          // 生成客户列表HTML
          let contentHTML = '<ul class="customer-list">';
          customersArray.forEach(customer => {
            contentHTML += `<li class="customer-item">${customer}</li>`;
          });
          contentHTML += '</ul>';

          popupContent.innerHTML = contentHTML;

          // 显示弹窗
          safeElement(popupId, el => el.style.display = 'block');
          safeElement(overlayId, el => el.style.display = 'block');
        } catch (error) {
          console.error(`显示${type === 'vibration' ? '振动统计' : '工艺参数'}客户弹窗时出错:`, error);
        }
      }

      // 客户弹窗通用函数 - 隐藏客户列表弹窗
      function hideCustomersPopupCommon(type = 'process') {
        try {
          const popupId = type === 'vibration' ? 'vibration-customers-popup' : 'customers-popup';
          const overlayId = type === 'vibration' ? 'vibration-popup-overlay' : 'popup-overlay';

          safeElement(popupId, el => el.style.display = 'none');
          safeElement(overlayId, el => el.style.display = 'none');
        } catch (error) {
          console.error(`隐藏${type === 'vibration' ? '振动统计' : '工艺参数'}客户弹窗时出错:`, error);
        }
      }

      // 主题切换功能
      function toggleTheme() {
        const html = document.documentElement;
        const isLightTheme = html.classList.contains('light-theme');

        html.classList.toggle('light-theme');
        localStorage.setItem('theme', isLightTheme ? 'dark' : 'light');

        // 重新获取切换后的主题状态来更新按钮文字
        const newIsLightTheme = html.classList.contains('light-theme');
        safeElement('theme-toggle-text', el => el.textContent = newIsLightTheme ? '切换到深色主题' : '切换到亮色主题');
        safeElement('toolbar-theme', btn => btn.textContent = newIsLightTheme ? '深色主题' : '亮色主题');
        updateAllThemeElements();
      }

      // 更新信息相关配置
      const UPDATE_INFO_URL = 'https://gitee.com/lplflxyq/bearing-update/raw/master/update-info.json';
      let updateData = null;
      let currentAbortController = null;

      // 比较版本号
      function isNewerVersion(newVersion, currentVersion) {
        const newParts = newVersion.split('.').map(Number);
        const currentParts = currentVersion.split('.').map(Number);

        for (let i = 0; i < Math.max(newParts.length, currentParts.length); i++) {
          if ((newParts[i] || 0) !== (currentParts[i] || 0)) return (newParts[i] || 0) > (currentParts[i] || 0);
        }
        return false;
      }

      // 检查系统更新
      function checkForUpdates(isAutoCheck = false) {
        safeElement('update-status', el => el.textContent = '检查更新中...');
        safeElement('check-update-button', btn => btn.disabled = true);
        toggleElement('update-progress', true);
        toggleElement('update-actions', false);

        try {
          const controller = new AbortController();
          currentAbortController = controller;
          const timeoutId = setTimeout(() => controller.abort(), 15000);

          fetch(UPDATE_INFO_URL, { signal: controller.signal, headers: { 'Accept': 'application/json' } })
            .then(response => {
              clearTimeout(timeoutId);
              if (!response.ok) throw new Error(`HTTP错误! 状态码: ${response.status}`);
              return response.json();
            })
            .then(updateInfo => {
              clearTimeout(timeoutId);
              if (!updateInfo || !updateInfo.version || !updateInfo.downloadUrl) throw new Error('无效的更新信息格式');

              const now = new Date();
              localStorage.setItem('lastUpdateCheck', now.toLocaleString());
              localStorage.setItem('lastUpdateCheckTime', now.getTime().toString());

              handleUpdateCheckResult(updateInfo, APP_VERSION, isAutoCheck);
            })
            .catch(error => handleUpdateError(error, isAutoCheck))
            .finally(() => {
              toggleElement('update-progress', false);
              safeElement('check-update-button', btn => btn.disabled = false);
            });
        } catch (error) {
          handleUpdateError(error, isAutoCheck);
          safeElement('check-update-button', btn => btn.disabled = false);
        }
      }

      // 处理更新检查结果
      function handleUpdateCheckResult(updateInfo, currentVersion, isAutoCheck) {
        const lastCheck = localStorage.getItem('lastUpdateCheck') || '从未';

        if (isNewerVersion(updateInfo.version, currentVersion)) {
          // 发现更新信息
          updateData = updateInfo;
          safeElement('update-status', el => {
            if (isAutoCheck) {
              el.innerHTML = `发现新版本 <strong>V${updateInfo.version}</strong>，请进入更多页面查看详细信息并更新。`;
            } else {
              el.innerHTML = `发现新版本 <strong>V${updateInfo.version}</strong><br>`;
              el.innerHTML += `发布日期: ${updateInfo.releaseDate || '未知'}<br>`;
              el.innerHTML += '更新内容:<br>';
              if (updateInfo.changelog && Array.isArray(updateInfo.changelog)) {
                updateInfo.changelog.forEach(item => {
                  el.innerHTML += `- ${item}<br>`;
                });
              }
            }
          });

          if (!isAutoCheck) {
            toggleElement('update-actions', true);
            safeElement('install-update-button', btn => btn.disabled = false);
          }
        } else {
          // 没有新版本
          safeElement('update-status', el => {
            if (isAutoCheck) {
              el.textContent = `当前已是最新版本，上次检查: ${lastCheck}`;
            } else {
              el.innerHTML = `当前已是最新版本 (V${currentVersion})<br>`;
              el.innerHTML += `发布日期: ${updateInfo.releaseDate || '未知'}<br>`;
              if (updateInfo.changelog && Array.isArray(updateInfo.changelog)) {
                el.innerHTML += '版本内容:<br>';
                updateInfo.changelog.forEach(item => {
                  el.innerHTML += `- ${item}<br>`;
                });
              }
            }
          });

          toggleElement('updateActions', false);
        }
      }

      // 处理更新错误
      function handleUpdateError(error, isAutoCheck) {
        console.error('更新检查出错:', error);
        const lastCheck = localStorage.getItem('lastUpdateCheck') || '从未';
        safeElement('update-status', el => {
          if (isAutoCheck) {
            el.textContent = `上次检查: ${lastCheck}`;
          } else {
            let errorMessage = '检查更新失败，请稍后重试';
            if (error.name === 'AbortError') errorMessage = '连接超时，请检查网络连接后重试';
            else if (error.message?.includes('Failed to fetch')) errorMessage = '网络连接失败，请检查网络设置';
            else if (error.message?.includes('Unexpected token')) errorMessage = '更新信息格式错误';
            else if (error.message?.includes('HTTP错误')) errorMessage = '服务器返回错误，请稍后重试';
            el.textContent = errorMessage;
          }
        });
      }

      // 自动检查更新
      function autoCheckForUpdates() {
        setTimeout(() => checkForUpdates(true), 2000);
      }

      // 安装更新
      function installUpdate() {
        if (!updateData) {
          console.error('没有更新数据');
          alert('没有可用的更新数据');
          return;
        }

        console.log('开始安装更新:', updateData);
        console.log('下载链接:', updateData.downloadUrl);

        try {
          if (typeof AndroidDownloadManager !== 'undefined' && AndroidDownloadManager.downloadUpdate) {
            console.log('使用AndroidDownloadManager下载');
            AndroidDownloadManager.downloadUpdate(updateData.downloadUrl);
            alert('开始下载更新文件，请在通知栏查看下载进度，下载完成后将自动安装。');
          } else {
            console.log('AndroidDownloadManager不可用，使用浏览器下载');
            window.location.href = updateData.downloadUrl;
            alert('开始下载更新文件，请在浏览器中查看下载进度。');
          }
        } catch (error) {
          console.error('调用Android下载功能失败:', error);
          alert('下载失败，请手动下载更新文件。错误信息: ' + error.message);
        }
      }

      // 重置更新相关的UI状态
      function resetUpdateUI() {
        // 重置UI元素状态
        const elements = [
          { id: 'update-progress', display: 'none' },
          { id: 'update-actions', display: 'none' },
          { id: 'progress-bar', style: { width: '0%' } },
          { id: 'progress-percentage', textContent: '0%' },
          { id: 'download-status-text', textContent: '' },
          { id: 'cancel-update-button', display: 'none' }
        ];

        elements.forEach(({ id, display, style, textContent }) => {
          safeElement(id, el => {
            if (display !== undefined) el.style.display = display;
            if (style) Object.assign(el.style, style);
            if (textContent !== undefined) el.textContent = textContent;
          });
        });

        // 重置按钮和状态
        safeElement('check-update-button', btn => btn.disabled = false);
        safeElement('update-status', el => el.textContent = `上次检查: ${localStorage.getItem('lastUpdateCheck') || '从未'}`);
        updateData = null;
      }

      // 取消更新
      function cancelUpdate() {
        if (currentAbortController) {
          currentAbortController.abort();
          currentAbortController = null;
        }
        resetUpdateUI();
      }

      // 更新所有界面元素的主题
      function updateAllThemeElements() {
        const isLightTheme = document.documentElement.classList.contains('light-theme');
        const themeVars = {
          textColor: isLightTheme ? 'var(--light-text-light)' : 'var(--dark-text-light)',
          borderColor: isLightTheme ? 'var(--light-border-dark)' : 'var(--dark-border-dark)',
          cardBgColor: isLightTheme ? 'var(--light-card-bg)' : 'var(--dark-card-bg)',
          resultBorder: isLightTheme ? '1px solid #999999' : '1px solid rgba(255, 255, 255, 0.1)',
          buttonHover: isLightTheme ? 'var(--secondary-blue)' : 'rgba(0, 168, 255, 0.8)',
          buttonActive: isLightTheme ? 'rgba(0, 168, 255, 0.7)' : 'rgba(0, 168, 255, 0.6)'
        };

        // 更新文本颜色（不修改背景色，排除工具栏按钮、统计按钮、参数标签和参数值）
        document.querySelectorAll('h1, h2, h3, h4, h5, h6, p, span, label').forEach(el => {
          // 排除工具栏按钮、统计按钮、参数标签、参数值、主题切换按钮文本及其子元素
          if (!el.closest('.toolbar-button') && !el.classList.contains('toolbar-button') &&
            !el.classList.contains('toolbar-text') && !el.classList.contains('toolbar-icon') &&
            !el.closest('button[onclick*="showUnifiedProcessFilter"]') &&
            !el.classList.contains('param-label') && !el.classList.contains('param-value') &&
            !el.closest('.theme-toggle-btn')) {
            el.style.color = themeVars.textColor;
          }
        });

        // 更新输入框文本颜色（包括国标界面和工艺界面的输入框）
        document.querySelectorAll('input[type="text"], input[type="number"], textarea').forEach(el => {
          // 排除密码输入框（它有特殊的颜色处理）
          if (el.id !== 'pricePasswordInput') {
            el.style.color = themeVars.textColor;
          }
        });

        // 确保.param-label和.param-value使用CSS文件中定义的颜色，清除内联样式
        document.querySelectorAll('.param-label, .param-value').forEach(el => {
          el.style.color = ''; // 清除内联样式，让CSS文件中的规则生效
        });
      }

      // 从本地存储加载主题
      function loadThemeFromStorage() {
        const savedTheme = localStorage.getItem('theme');
        // 如果没有保存的主题，默认为亮色主题
        const isLightTheme = savedTheme === null ? true : savedTheme === 'light';
        document.documentElement.classList.toggle('light-theme', isLightTheme);

        safeElement('toolbar-theme', btn => btn.textContent = isLightTheme ? '深色主题' : '亮色主题');
        safeElement('theme-toggle-text', el => el.textContent = isLightTheme ? '切换到深色主题' : '切换到亮色主题');
        updateAllThemeElements();
      }

      // 统一的工艺筛选函数 - 简单整合入口
      function showUnifiedProcessFilter(filterType) {
        switch (filterType) {
          case 'clearance':
            showClearanceStatistics();
            break;
          case 'vibration':
            showVibrationStatistics();
            break;
          case 'price':
            // 检查价格参数的密码验证状态
            // 首先检查sessionStorage中的验证状态（更可靠）
            const isVerifiedInSession = sessionStorage.getItem('priceParamsVerified') === 'true';
            // 同时检查全局变量和DOM状态
            const passwordContainer = document.getElementById('passwordContainer');
            const isContainerHidden = passwordContainer && passwordContainer.style.display === 'none';
            const isGloballyVerified = window.isPricePasswordVerified === true;

            // 只有在任一验证方式通过时才允许访问
            if (!isVerifiedInSession && !isContainerHidden && !isGloballyVerified) {
              // 直接显示密码输入框而不是提示消息
              showPricePasswordInput();
              return;
            }

            // 如果通过验证但全局变量未设置，则更新全局变量
            if (isVerifiedInSession || isContainerHidden) {
              window.isPricePasswordVerified = true;
            }

            showTaxIncludedPriceStatistics();
            break;
          default:
            console.error('未知的筛选类型:', filterType);
            alert('未知的筛选类型，请重试。');
            return;
        }
      }

      // 统一的初始化函数
      function initializeApp() {
        loadThemeFromStorage();
        // 默认显示工艺界面
        toggleProcessQuery();
        toggleElement('result', false);
        toggleElement('aboutSection', false);
        autoCheckForUpdates();
      }

      // 页面加载时初始化
      window.addEventListener('load', initializeApp);


    </script>
    <script src="materials.js"></script>
    <script src="ball-price-calculator.js"></script>
    <script src="deep-groove-clearance-calculator.js"></script>
    <script src="Tolerance data.js"></script>
    <script src="tolerance-query.js"></script>
